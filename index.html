.card{max-height:92vh;overflow:auto}.card>*{flex-shrink:0}

<script>
(()=>{
let lang='ru';try{lang=JSON.parse(localStorage.getItem('xinh')||'{}').lang||'ru'}catch(e){}
const T=lang==='ru'?{t:'Ошибка в приложении',d:'Подробнее',c:'Копировать',ok:'Скопировано'}:{t:'App error',d:'Details',c:'Copy',ok:'Copied'};
const SKIP=/ResizeObserver loop|^Script error\.?$|AbortError|NotAllowedError|play\(\) request|Failed to fetch dynamically/i;
const seen={};
function host(){let h=document.getElementById('errs');if(!h){h=document.createElement('div');h.id='errs';(document.body||document.documentElement).append(h)}return h}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function show(msg,detail){
 msg=String(msg||'Unknown error').slice(0,300);detail=String(detail||'').slice(0,3000);
 if(SKIP.test(msg))return;
 const now=Date.now();if(seen[msg]&&now-seen[msg]<5000)return;seen[msg]=now;
 const h=host();while(h.children.length>=3)h.firstChild.remove();
 const c=el('div','errc'),eh=el('div','eh'),et=el('div','et');
 et.append(el('b','',T.t),el('span','',msg));
 eh.append(el('div','ei','⚠️'),et);
 const ed=el('div','ed',detail||msg),ea=el('div','ea');
 let timer=setTimeout(()=>c.remove(),9000);
 const bd=el('button','',T.d),bc=el('button','',T.c),bx=el('button','ex','✕');
 bd.onclick=()=>{c.classList.toggle('open');clearTimeout(timer)};
 bc.onclick=async()=>{try{await navigator.clipboard.writeText(msg+'\n'+detail);bc.textContent=T.ok}catch(e){}setTimeout(()=>bc.textContent=T.c,1500)};
 bx.onclick=()=>{clearTimeout(timer);c.remove()};
 ea.append(bd,bc,bx);c.append(eh,ed,ea);h.append(c)}
window.addEventListener('error',e=>{
 if(e.target&&e.target!==window)return;
 show(e.message,(e.filename||'')+':'+(e.lineno||0)+':'+(e.colno||0)+'\n'+((e.error&&e.error.stack)||''))});
window.addEventListener('unhandledrejection',e=>{
 const r=e.reason;show((r&&r.message)||String(r),(r&&r.stack)||'')});
window.xinhError=show; /* вручную: xinhError('текст','детали') */
})();
</script>

function applyAll(){
 const h=document.documentElement;h.dataset.mode=S.mode;if((S.accent||'')[0]==='#'){h.dataset.accent='custom';h.style.setProperty('--ac',S.accent)}else{h.dataset.accent=S.accent;h.style.removeProperty('--ac')}h.lang=S.lang==='ru'?'ru':'en';
 buildRegions();document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=t(e.dataset.ip));
 document.querySelectorAll('#segMode button').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
 const sa=$('segAcc');sa.textContent='';
 Object.keys(ACC).forEach(k=>{const b=document.createElement('button');b.className='sw'+(k===S.accent?' on':'');b.style.setProperty('--c',ACC[k]);b.setAttribute('aria-label',t(k));b.title=t(k);b.onclick=()=>{S.accent=k;save();applyAll()};sa.append(b)});
 $('selLang').value=S.lang;syncSet();refreshSet();
 if(me){renderList();peer?(renderMsgs(),setHead()):renderMsgs()}
}
document.querySelectorAll('#segMode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();applyAll()});
$('selLang').onchange=e=>{S.lang=e.target.value;save();applyAll()};

function showAuth(w){$('authLogin').classList.toggle('hide',w!=='login');$('authReg').classList.toggle('hide',w!=='reg');$('authConfirm').classList.toggle('hide',w!=='confirm');$('app').classList.add('hide');$('gear').classList.remove('hide')}
$('toReg').onclick=()=>{$('liErr').textContent='';showAuth('reg')};

$('fLogin').onsubmit=async e=>{e.preventDefault();
 const email=$('liEmail').value.trim(),password=$('liPass').value;
 if(!email||password.length<6){$('liErr').textContent=t('e_fill');return}
 const{error}=await sb.auth.signInWithPassword({email,password});if(error)$('liErr').textContent=error.message};
$('fReg').onsubmit=async e=>{e.preventDefault();
 const nm=$('rgName').value.trim(),email=$('rgEmail').value.trim(),password=$('rgPass').value;
 if(!nm){$('rgErr').textContent=t('e_name');return}
 const un=$('rgUser').value.trim().replace(/^@/,'').toLowerCase();
 if(!/^[a-z0-9_]{3,20}$/.test(un)){$('rgErr').textContent=t('e_user');return}
 if(!email||password.length<6){$('rgErr').textContent=t('e_fill');return}
 if(password!==$('rgPass2').value){$('rgErr').textContent=t('e_match');return}
 const{data:free}=await sb.rpc('username_free',{u:un});if(free===false){$('rgErr').textContent=t('e_taken');return}
 const{data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:nm,username:un}}});
 if(error)$('rgErr').textContent=error.message;
 else if(!data.session){$('confTxt').textContent=t('conf_txt').replace('{e}',email);$('liEmail').value=email;showAuth('confirm')}};
$('out').onclick=()=>sb.auth.signOut();

 if(s&&s.user){upAcct(s);if(!me||me.id!==s.user.id)setTimeout(()=>boot(s.user),0)}
 else{me=null;peer=null;prof=null;$('profBox').classList.add('hide');if(chan){sb.removeChannel(chan);chan=null}showAuth('login')}
});

async function boot(u){
 me=u;resetForBoot();$('authLogin').classList.add('hide');$('authReg').classList.add('hide');$('authConfirm').classList.add('hide');$('gear').classList.add('hide');
 $('app').classList.remove('hide','chat');$('who').textContent=u.email;
 await cloudGate();
 const[{data:us},{data:ms}]=await Promise.all([
  sb.rpc('profiles_view'),
  sb.from('messages').select('*').order('created_at').limit(1000)]);
 users=(us||[]).filter(x=>x.id!==u.id);msgs=ms||[];renderList();renderMsgs();await loadMe();await loadRooms();await loadRx();await loadExtra();await joinPending();beat();clearInterval(window.hb);window.hb=setInterval(beat,60000);
 const qu=new URLSearchParams(location.search).get('u'),pu=qu&&users.find(x=>x.username===qu.toLowerCase());if(pu)openChat(pu);
 chan=sb.channel('m-'+u.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
  const m=p.new;if(!m.room_id&&m.sender_id!==me.id&&m.recipient_id!==me.id)return;
  if(msgs.some(x=>x.id===m.id))return;msgs.push(m);if(m.comment_of){renderComments();return}
  const other=m.room_id?'r'+m.room_id:(m.sender_id===me.id?m.recipient_id:m.sender_id);if(m.room_id&&!rooms.some(x=>x.id===other))loadRooms();
  if(m.sender_id!==me.id&&(!peer||peer.id!==other))unread.add(other);
  if(m.sender_id!==me.id&&S[kindOf(m)]!==false&&!isMuted(m)){fx();if(S.notif&&(!peer||peer.id!==other||document.hidden))notify(m,other)}
  if(!m.room_id&&m.sender_id!==me.id&&peer&&peer.id===other&&!document.hidden)sb.rpc('mark_read',{pid:other}).then(()=>{});
  renderList();if(peer&&peer.id===other)renderMsgs();
  if(!m.room_id&&!users.some(x=>x.id===other))refreshUsers();
 }).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>{const i=msgs.findIndex(x=>x.id===p.new.id);if(i>=0){msgs[i]=p.new;renderList();if(peer)renderMsgs()}})
 .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{msgs=msgs.filter(x=>x.id!==p.old.id);renderList();if(peer)renderMsgs()}).on('postgres_changes',{event:'*',schema:'public',table:'message_reactions'},p=>rxEv(p)).subscribe();
}
async function refreshUsers(){const{data}=await sb.rpc('profiles_view');users=(data||[]).filter(x=>x.id!==me.id);if(peer){peer=users.find(x=>x.id===peer.id)||peer;setHead()}renderList()}

function last(id){for(let i=msgs.length-1;i>=0;i--){const m=msgs[i];if((m.room_id?('r'+m.room_id===id):inDm(m,id))&&!hid.has(m.id)&&alive(m))return m}}
const dn=u=>((u.id in conts)&&conts[u.id])||u.display_name;
function renderList(){
 const q=$('search').value.toLowerCase().trim(),box=$('list');box.textContent='';
 $('tChats').classList.toggle('on',tab==='chats');$('tCont').classList.toggle('on',tab==='cont');$('cats').classList.toggle('hide',tab==='cont');document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat));
 let base;
 if(tab==='cont'){const b=document.createElement('button');b.textContent=t('imp');b.style.cssText='margin:8px 14px 0;width:calc(100% - 28px)';b.onclick=importContacts;box.append(b);base=users.filter(u=>u.id in conts)}
 else{base=q?[...rooms,...users]:[...rooms,...users.filter(u=>last(u.id)||(u.id in conts))];
  if(cat==='groups')base=base.filter(u=>u.room&&u.kind==='group');else if(cat==='channels')base=base.filter(u=>u.room&&u.kind==='channel');
  else if(cat==='bots')base=base.filter(u=>u.is_bot);else if(cat==='contacts')base=users.filter(u=>u.id in conts);else if(cat[0]==='f'){const f=folders.find(x=>'f'+x.id===cat);base=[CL(),...rooms,...users].filter(u=>f&&f.chat_ids.includes(u.id))}
  if(cat==='all'&&(!q||t('cloud').toLowerCase().includes(q)))base=[CL(),...base]}
 base.filter(u=>!q||(dn(u)+' '+(u.email||'')+' '+(u.username||'')).toLowerCase().includes(q))
 .sort((a,b)=>(b.cloud?1:0)-(a.cloud?1:0)||new Date(last(b.id)?.created_at||0)-new Date(last(a.id)?.created_at||0))
 .forEach(u=>{
  const d=document.createElement('div');d.className='u'+(peer&&peer.id===u.id?' on':'');
  const av=document.createElement('div');av.className='av';setAv(av,u);
  const w=document.createElement('div');w.style.minWidth=0;
  const n=document.createElement('div');n.className='nm';n.textContent=dn(u);
  if(u.verified)n.append(vb());if(u.is_service||u.room){const b=document.createElement('span');b.className='badge';b.textContent=t(u.room?u.kind:'service');n.append(b)}
  const s=document.createElement('div');s.className='sb';s.textContent=(isLocked(u.id)?'🔒':last(u.id)?.body)||(u.cloud?t('cloud_sub'):u.room?t(u.kind):(u.username?'@'+u.username:''));
  w.append(n,s);d.append(av,w);
  if(unread.has(u.id)){const x=document.createElement('div');x.className='dot';d.append(x)}
  d.onclick=()=>openChat(u);box.append(d);
 });
 if(!box.querySelector('.u')){const e=document.createElement('div');e.className='empty';e.textContent=t(tab==='cont'?'nocont':'nousers');box.append(e)}
}

const RX=[['b',/\*\*([\s\S]+?)\*\*/],['u',/__([\s\S]+?)__/],['s',/~~([\s\S]+?)~~/],['sp',/\|\|([\s\S]+?)\|\|/],['m',/`([^`\n]+?)`/],['i',/\*([^*\n]+?)\*/],
 ['a',/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/],['url',/https?:\/\/[^\s<]+/],['d',/\b(?:0?[1-9]|[12]\d|3[01])\.(?:0?[1-9]|1[0-2])(?:\.\d{4})?\b/]];
const TG={b:'strong',u:'u',s:'s',i:'em',m:'code',sp:'span'};
function inline(el,txt){
 let best=null;for(const[k,r]of RX){const m=r.exec(txt);if(m&&(!best||m.index<best.m.index))best={k,m}}
 if(!best){if(txt)el.append(txt);return}
 const{k,m}=best;let len=m[0].length;if(m.index>0)el.append(txt.slice(0,m.index));let n;
 if(k==='a'){n=document.createElement('a');n.href=m[2];n.target='_blank';n.rel='noopener noreferrer';inline(n,m[1])}
 else if(k==='url'){const u=m[0].replace(/[.,;:!?)\]]+$/,'');len=u.length;n=document.createElement('a');n.href=u;n.target='_blank';n.rel='noopener noreferrer';n.textContent=u}
 else if(k==='d'){n=document.createElement('span');n.className='dt';n.textContent=m[0]}
 else{n=document.createElement(TG[k]);if(k==='m')n.textContent=m[1];else inline(n,m[1]);
  if(k==='sp'){n.className='sp';n.onclick=e=>{e.stopPropagation();n.classList.toggle('on')}}}
 el.append(n);inline(el,txt.slice(m.index+len))}

  b.onclick=async e=>{e.stopPropagation();try{await navigator.clipboard.writeText(code);b.textContent='✓'}catch(_){b.textContent='✕'}setTimeout(()=>b.textContent=t('copy'),1400)};w.append(b)}

function rich(el,txt){
 txt.split(/(```[\s\S]*?```)/g).forEach(p=>{
  if(p.length>=6&&p.startsWith('```')&&p.endsWith('```')){codeBlock(el,p.slice(3,-3).replace(/^\n/,'').replace(/\n$/,''));return}
  let buf=[];const flush=()=>{if(buf.length){const s=document.createElement('span');inline(s,buf.join('\n'));el.append(s);buf=[]}};
  p.split('\n').forEach(ln=>{const h=/^(#{1,3})\s+(.+)$/.exec(ln);if(h){flush();const e=document.createElement('div');e.className='h'+h[1].length;inline(e,h[2]);el.append(e)}else buf.push(ln)});flush()})}

 if(!o.items.length)box.append(H('div',{className:'lbl',textContent:t('nocont')}));

$('pMusicFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 const ext=(f.name.split('.').pop()||'').toLowerCase();
 if(!AUDIO_RE.test('.'+ext)||(f.type||'').startsWith('video/')&&!/^(ogg|oga|opus)$/.test(ext)){$('pErr').textContent=t('e_music');return}
 if(f.size>10485760){$('pErr').textContent=t('e_big');return}
 $('pErr').textContent='';
 const path=me.id+'/music_'+Date.now()+'.'+ext.replace(/\W/g,'').slice(0,5);
 const{error}=await sb.storage.from('xinh').upload(path,f,{contentType:AUDIO_MIME[ext]||'audio/mpeg'});if(error){$('pErr').textContent=error.message;return}
 await sb.from('profiles').update({music_url:sb.storage.from('xinh').getPublicUrl(path).data.publicUrl,music_name:f.name.replace(/\.[^.]+$/,'')}).eq('id',me.id);await loadMe()};

function upAcct(ss){if(!ss||!ss.user)return;const a=getAcc(),i=a.findIndex(x=>x.id===ss.user.id);
 if(i>=0){a[i].at=ss.access_token;a[i].rt=ss.refresh_token;a[i].email=ss.user.email}else if(a.length<3)a.push({id:ss.user.id,email:ss.user.email,at:ss.access_token,rt:ss.refresh_token,name:ss.user.email,av:null});setAcc(a)}

 a.forEach(x=>{const av=H('div',{className:'av'});setAv(av,{display_name:x.name,avatar_url:x.av});const cur=me&&x.id===me.id;
  b.append(H('div',{className:'srow'+(cur?' cur':''),onclick:()=>switchAcc(x.id)},av,H('span',{textContent:(x.name||x.email)+(cur?' ✓':'')}),H('button',{type:'button',className:'x',textContent:'✕',onclick:e=>{e.stopPropagation();dropAcc(x.id)}})))});

async function switchAcc(id){if(me&&id===me.id)return;const x=getAcc().find(y=>y.id===id);if(!x)return;
 const{error}=await sb.auth.setSession({access_token:x.at,refresh_token:x.rt});if(error){setAcc(getAcc().filter(y=>y.id!==id));alert(error.message);BLD.accounts();return}$('modal').classList.add('hide')}

<!-- ===== АЛЬБОМЫ: несколько фото/видео (до 9) в одном сообщении + подпись текстом ===== -->
<script>
(()=>{

Object.assign(I18.ru,{album_max:'Максимум 9 вложений в одном сообщении.'});
Object.assign(I18.en,{album_max:'Maximum 9 attachments per message.'});

const isMed=f=>{const ty=f.type||'';if(ty.startsWith('audio/'))return false;return ty.startsWith('image/')||ty.startsWith('video/')||IMG.test(f.name||'')||VID.test(f.name||'')};
const kindOfF=f=>((f.type||'').startsWith('video/')||VID.test(f.name||''))?'video':'image';

 pend.forEach((p,i)=>{const w=H('div',{className:'pt'}),e=p.kind==='video'?H('video',{src:p.url+'#t=0.1',muted:true,preload:'metadata'}):H('img',{src:p.url,alt:''});
  w.append(e,H('button',{type:'button',className:'x2',textContent:'×',onclick:()=>{URL.revokeObjectURL(p.url);pend.splice(i,1);draw()}}));
  if(p.kind==='video')w.append(H('i',{textContent:'▶'}));bar.append(w)})}
function clear(){pend.forEach(p=>URL.revokeObjectURL(p.url));pend=[];draw()}

/* --- выбор файлов: можно несколько сразу --- */
const fi=$('file');fi.multiple=true;
fi.onchange=e=>{const fs=[...e.target.files];e.target.value='';let over=false;
 fs.filter(f=>!isMed(f)).forEach(f=>sendFile(f));
 fs.filter(isMed).forEach(f=>{if(f.size>26214400){alert(t('e_big'));return}if(pend.length>=MAX){over=true;return}pend.push({f,kind:kindOfF(f),url:URL.createObjectURL(f)})});
 if(over)alert(t('album_max'));draw();$('txt').focus()};

/* --- отправка: одно сообщение, текст = подпись --- */
async function sendPend(body){
 const items=pend.slice(),target=peer,rep=reply;if(!items.length||!target||busy)return false;busy=true;$('sendBtn').disabled=true;

   const{error}=await sb.storage.from('xinh').upload(path,f,{contentType:(f.type||'application/octet-stream').split(';')[0]});if(error)throw error;
   return{u:sb.storage.from('xinh').getPublicUrl(path).data.publicUrl,k:p.kind,n:f.name}}));
  const one=ups.length===1;
  const{data,error}=await sb.from('messages').insert({...tgt(target),...(rep?{reply_to:rep.id}:{}),body:body||(one?'📎 '+ups[0].n:'🖼'),kind:ups[0].k,file_url:ups[0].u,file_name:one?ups[0].n:JSON.stringify(ups)}).select().single();
  if(error)throw error;
  clear();sent();if(!msgs.some(x=>x.id===data.id)){msgs.push(data);renderList();renderMsgs()}
  return true;
 }catch(e){alert(t('notsent')+errTxt(e));return false}
 finally{busy=false;$('sendBtn').disabled=false}}

$('form').onsubmit=async e=>{e.preventDefault();
 if(pend.length){if(await sendPend($('txt').value.trim())){$('txt').value='';autoSize()}return}

/* --- показ в чате --- */

  const al=albumOf(m);
  if(al){const g=H('div',{className:'alb c'+(al.length===2||al.length===4?2:3)});
   al.forEach((x,i)=>{const c=H('div',{className:'ac',onclick:ev=>{ev.stopPropagation();openLb(al,i)}}),
     e=x.k==='video'?H('video',{src:x.u+'#t=0.1',preload:'metadata',muted:true,playsInline:true}):H('img',{src:x.u,alt:'',loading:'lazy',draggable:false});
    if(peer&&peer.protect)e.oncontextmenu=ev=>ev.preventDefault();c.append(e);if(x.k==='video')c.append(H('b',{textContent:'▶'}));g.append(c)});d.append(g)}

  return}

/* полная пересинхронизация */
async function resync(){
 if(!me||syncing||!navigator.onLine)return;syncing=true;
 try{
  const[a,b]=await Promise.all([sb.rpc('profiles_view'),
   sb.from('messages').select('*').order('created_at',{ascending:false}).limit(1000)]);
  if(a.error||b.error)return;

  ms.forEach(m=>{if(old.has(m.id)||m.comment_of||m.sender_id===me.id)return;

  renderList();renderMsgs();

 }catch(e){}finally{syncing=false}
}
async function cycle(min){
 setNet('upd');const t0=Date.now();await resync();
 await new Promise(r=>setTimeout(r,Math.max(0,min-(Date.now()-t0))));

  const n=p.new;if(!me||!n||n.id===me.id)return;let ch;

  raw[n.id]=key(n);if(!ch)return;
  clearTimeout(pt);pt=setTimeout(async()=>{await refreshUsers();renderMsgs()},400);
 }).subscribe();
}

/* запуск приложения: «обновление…» 2 секунды */
const _boot=boot;

 const p=_boot(u);setTimeout(paint,0);await p;subProf();

/* ================= ДНИ РОЖДЕНИЯ ================= */
const pad=n=>String(n).padStart(2,'0');
const mdOf=d=>pad(d.getMonth()+1)+'-'+pad(d.getDate());
function bdMD(s,y){const p=(s||'').split('-');if(p.length<3)return null;let m=p[1],d=p[2];
 if(m==='02'&&d==='29'&&!(y%4===0&&(y%100!==0||y%400===0)))d='28';return m+'-'+d}
function bdList(){if(!me)return[];
 const n=new Date(),tm=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),a0=mdOf(n),a1=mdOf(tm),out=[];
 users.filter(u=>(u.id in conts)&&u.birthdate).forEach(u=>{
  if(bdMD(u.birthdate,n.getFullYear())===a0)out.push({u,k:'today'});
  else if(bdMD(u.birthdate,tm.getFullYear())===a1)out.push({u,k:'tom'})});
 return out.sort((x,y)=>(x.k==='today'?0:1)-(y.k==='today'?0:1))}
const bdText=x=>t('bd_'+x.k).replace('{n}',dn(x.u));

function pushBd(list){if(!S.notif||!list.length)return;
 let st={};try{st=JSON.parse(localStorage.getItem('xinh_bdn')||'{}')}catch(e){}
 const day=new Date().toDateString();let ch=false;
 Object.keys(st).forEach(k=>{if(!k.endsWith('|'+day)){delete st[k];ch=true}});
 list.forEach(x=>{const k=me.id+':'+x.u.id+':'+x.k+'|'+day;if(st[k])return;st[k]=1;ch=true;
  const txt=bdText(x);
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
   try{const nt=new Notification('🎂 XINH',{body:txt,icon:x.u.avatar_url||undefined,tag:k});nt.onclick=()=>{window.focus();openChat(x.u);nt.close()}}catch(e){toast(x.u,txt)}}
  else toast(x.u,txt)});
 if(ch)try{localStorage.setItem('xinh_bdn',JSON.stringify(st))}catch(e){}}

function renderBd(){if(!me)return;let b=$('bdbar');
 if(!b){b=H('div',{id:'bdbar'});const s=$('sbar');s?s.after(b):$('list').before(b)}
 b.textContent='';const l=bdList();
 if(tab==='chats')l.forEach(x=>b.append(H('div',{className:'srow',onclick:()=>openChat(x.u)},H('span',{textContent:'🎂'}),H('span',{textContent:bdText(x)}))));
 pushBd(l)}
const _rl3=renderList;renderList=function(){_rl3();renderBd()};
setInterval(()=>{if(me)renderBd()},600000);
document.addEventListener('visibilitychange',()=>{if(me)renderBd()});

/* ================= СТАТУСЫ: печатает, записывает... ================= */
const LAB={typing:'st_typing',voice:'st_voice',choose:'st_choose',upload:'st_upload'};
const chs={},stt={};
const ckey=p=>p.room?'r'+p.rid:[me.id,p.id].sort().join('_');
function refreshSt(k){if(peer&&me&&!peer.cloud&&!peer.preview&&ckey(peer)===k)setHead()}
function getCh(p){if(!p||!me||p.cloud||p.preview)return null;const k=ckey(p);if(chs[k])return chs[k];
 const c=sb.channel('ty-'+k,{config:{broadcast:{self:false}}});
 c.on('broadcast',{event:'st'},m=>{const pl=m.payload||{};if(!pl.u||pl.u===me.id)return;
  const o=stt[k]=stt[k]||{};
  if(pl.s&&pl.s!=='idle')o[pl.u]={s:pl.s,exp:Date.now()+6000};else delete o[pl.u];
  refreshSt(k);setTimeout(()=>refreshSt(k),6200)}).subscribe();
 return chs[k]=c}
function curSt(p){const o=stt[ckey(p)];if(!o)return'';const now=Date.now();
 const e=Object.entries(o).find(([,v])=>v.exp>now);if(!e)return'';
 const lab=t(LAB[e[1].s]);
 if(p.room){const u=users.find(x=>x.id===e[0]);return (u?dn(u):'…')+' '+lab}
 return lab}

const _sh3=setHead;
setHead=function(){_sh3();if(!peer||!me||peer.cloud||peer.preview)return;
 const s=curSt(peer);$('hsb').style.color=s?'var(--act)':'';if(s)$('hsb').textContent=s};
const _oc3=openChat;
openChat=async function(u){await _oc3(u);if(peer&&peer.id===u.id){getCh(peer);setHead()}};

/* что делаю я */
let lastTyp=0,chooseUntil=0,upN=0,lastS={k:'',s:'idle'};
function curState(){
 if(typeof rec!=='undefined'&&rec)return'voice';
 if(upN>0)return'upload';
 const ab=$('abar');
 if(Date.now()<chooseUntil||(ab&&!ab.classList.contains('hide')))return'choose';
 if($('txt').value.trim()&&Date.now()-lastTyp<3500)return'typing';
 return'idle'}
function tick(){if(!me||!peer)return;const c=getCh(peer);if(!c)return;
 const s=curState(),k=ckey(peer);
 if(s==='idle'&&(lastS.k!==k||lastS.s==='idle'))return;
 lastS={k,s};
 try{const r=c.send({type:'broadcast',event:'st',payload:{u:me.id,s}});if(r&&r.catch)r.catch(()=>{})}catch(e){}}
setInterval(tick,2500);
$('txt').addEventListener('input',()=>{lastTyp=Date.now();tick()});
$('attach').addEventListener('click',()=>{chooseUntil=Date.now()+20000;tick()});
$('file').addEventListener('change',()=>{chooseUntil=Date.now()+3000;setTimeout(tick,100)});
$('mic').addEventListener('click',()=>setTimeout(tick,500));
$('form').addEventListener('submit',()=>{lastTyp=0;chooseUntil=0;setTimeout(tick,150)});
$('back').addEventListener('click',()=>{lastS={k:'',s:'idle'}});

/* загрузка файлов в чат = «отправляет медиа» (аватарки, музыку профиля и т.п. не считаем) */
const _stf=sb.storage.from.bind(sb.storage);
sb.storage.from=b=>{const o=_stf(b);if(b!=='xinh')return o;const up=o.upload.bind(o);
 o.upload=async(p,...r)=>{const track=/^[^/]+\/\d+(_\d+)?\.[^/]*$/.test(p||'');
  if(track){upN++;tick()}
  try{return await up(p,...r)}finally{if(track){upN--;tick()}}};
 return o};
})();
</script>

 const ti=H('input',{value:k>0?nm.slice(k+3):nm,maxLength:100,placeholder:t('mu_title')}),

 let cover=null,url=null;

<script>
(()=>{

/* ---------- хранилище (IndexedDB) ---------- */
const idb=new Promise(r=>{try{const q=indexedDB.open('xinh_wp',1);q.onupgradeneeded=()=>q.result.createObjectStore('w');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const wget=async k=>{const d=await idb;if(!d)return null;return new Promise(r=>{try{const q=d.transaction('w').objectStore('w').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})};
const wset=async(k,v)=>{const d=await idb;if(!d)return;return new Promise(r=>{try{const tx=d.transaction('w','readwrite'),s=tx.objectStore('w');v?s.put(v,k):s.delete(k);tx.oncomplete=()=>r();tx.onerror=()=>r()}catch(e){r()}})};

 if(!me){m.style.backgroundImage='';return}
 let w=peer?await wget('c:'+me.id+':'+peer.id):null;

/* ---------- кадрирование ---------- */
function cropWall(file){return new Promise(res=>{
 const url=URL.createObjectURL(file),img=new Image();
 img.onerror=()=>{URL.revokeObjectURL(url);alert(t('wp_err'));res(null)};
 img.onload=()=>{
  const ar=innerWidth/innerHeight;let ch=Math.round(Math.min(innerHeight*.5,380)),cw=Math.round(ch*ar);
  if(cw>320){cw=320;ch=Math.round(cw/ar)}
  const cv=H('canvas',{width:cw,height:ch}),g=cv.getContext('2d');
  cv.style.cssText='align-self:center;border-radius:18px;touch-action:none;cursor:grab;max-width:100%;border:1px solid var(--gb)';
  let zoom=1,dim=.25,x=0,y=0,drag=null;
  const base=()=>Math.max(cw/img.width,ch/img.height),s=()=>base()*zoom;
  const clamp=()=>{x=Math.min(0,Math.max(cw-img.width*s(),x));y=Math.min(0,Math.max(ch-img.height*s(),y))};
  const draw=()=>{g.clearRect(0,0,cw,ch);g.drawImage(img,x,y,img.width*s(),img.height*s());g.fillStyle='rgba(0,0,0,'+dim+')';g.fillRect(0,0,cw,ch)};
  x=(cw-img.width*s())/2;y=(ch-img.height*s())/2;clamp();draw();
  cv.onpointerdown=e=>{drag={px:e.clientX,py:e.clientY,x,y};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
  cv.onpointermove=e=>{if(!drag)return;const k=cw/cv.getBoundingClientRect().width;x=drag.x+(e.clientX-drag.px)*k;y=drag.y+(e.clientY-drag.py)*k;clamp();draw()};
  cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab'};
  const zr=H('input',{type:'range',min:1,max:4,step:.01,value:1}),dr=H('input',{type:'range',min:0,max:.7,step:.01,value:dim});
  zr.oninput=()=>{const o=s(),cx=(cw/2-x)/o,cy=(ch/2-y)/o;zoom=+zr.value;x=cw/2-cx*s();y=ch/2-cy*s();clamp();draw()};
  dr.oninput=()=>{dim=+dr.value;draw()};
  const ov=H('div',{id:'wpm'});
  const done=v=>{URL.revokeObjectURL(url);ov.remove();res(v)};
  const ok=H('button',{type:'button',className:'solid',textContent:t('save'),onclick:()=>{
   const ow=Math.min(900,Math.max(cw,Math.min(img.width,900))),k=ow/cw,oc=H('canvas',{width:ow,height:Math.round(ch*k)});
   oc.getContext('2d').drawImage(img,x*k,y*k,img.width*s()*k,img.height*s()*k);
   done({d:oc.toDataURL('image/jpeg',.85),dim})}});
  ov.onclick=e=>{if(e.target===ov)done(null)};
  ov.append(H('div',{className:'card'},H('h2',{textContent:t('wp_title')}),cv,H('div',{className:'lbl',textContent:t('wp_hint')}),
   H('div',{className:'lbl',textContent:t('wp_zoom')}),zr,H('div',{className:'lbl',textContent:t('wp_dim')}),dr,ok,H('button',{type:'button',textContent:t('cancel'),onclick:()=>done(null)})));
  document.body.append(ov)};
 img.src=url})}

function pickWall(sc){const inp=H('input',{type:'file',accept:'image/*'});

  pb.onclick=()=>choice(t('wp_chat'),[[t('wp_set'),()=>pickWall('c')],[t('wp_rm_chat'),async()=>{await wset(key('c'),null);applyWall()}]])}};

  [t('delchat_all'),async()=>{if(!confirm(t('delchat_conf')))return;const{error}=await sb.rpc('delete_chat_all',{pid:u.id});if(error)return alert(error.message);msgs=msgs.filter(m=>m.room_id||!inDm(m,u.id));after()}]])}

function actsOf(u){
 const id=u.id,pin=has('pin',id),ar=isA(id),ur=unread.has(id),mu=isMu(u);
 /* свайп влево: Закрепить · Не прочитано · В архив */
 const L=[
  {c:'pin',i:'📌',l:pin?'sw_unpin':'sw_pin',f:()=>{tog('pin',id,!pin);renderList()}},
  {c:'unr',i:ur?'✅':'✉️',l:ur?'sw_read':'sw_unread',f:()=>{
   if(ur){unread.delete(id);tog('unr',id,false);if(!u.room)sb.rpc('mark_read',{pid:id}).then(()=>{})}
   else{unread.add(id);tog('unr',id,true)}renderList()}},
  {c:'arc',i:ar?'📤':'📦',l:ar?'sw_unarch':'sw_arch',f:()=>{setA(id,!ar);renderList();toast(u,t(ar?'sw_unarch':'sw_arch'))}}];
 /* свайп вправо: Удалить · Очистить · Без звука */
 const Rr=[
  {c:'del',i:'🗑',l:'sw_del',f:()=>delChat(u)},
  {c:'clr',i:'🧹',l:'sw_clear',f:()=>clearChat(u)},
  {c:'mut',i:mu?'🔔':'🔕',l:mu?'sw_unmute':'sw_mute',f:()=>toggleMute(u,mu)}];
 return{L,R:Rr}}

/* ---------- жест ---------- */
let openW=null,openId=null,openSide=0,dragging=false,pend=false,sup=false;
function setX(w,x,anim){const r=w._row;r.style.transition=anim?'transform .26s cubic-bezier(.2,.9,.3,1)':'none';
 r.style.transform=x?'translateX('+x+'px)':'';w._x=x;clearTimeout(w._tm);
 if(x){w.classList.add('sx');w.classList.toggle('sl',x<0);w.classList.toggle('sr',x>0)}
 else if(anim)w._tm=setTimeout(()=>w.classList.remove('sx','sl','sr'),280);
 else w.classList.remove('sx','sl','sr')}
function closeW(w){if(!w)return;setX(w,0,true);if(openW===w){openW=null;openId=null}}
document.addEventListener('pointerdown',e=>{if(openW&&!openW.contains(e.target))closeW(openW)},true);

function attach(w,row,u,L,Rr){
 let sx=0,sy=0,bx=0,mode=0,pid=null;
 row.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;
  sx=e.clientX;sy=e.clientY;bx=w._x||0;mode=0;pid=e.pointerId});
 row.addEventListener('pointermove',e=>{if(e.pointerId!==pid||mode===2)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(mode===0){
   if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5){mode=1;dragging=true;try{row.setPointerCapture(pid)}catch(_){}}
   else if(Math.abs(dy)>10){mode=2;return}
   else return}
  setX(w,Math.max(-w._wl-24,Math.min(w._wr+24,bx+dx)),false)});
 const end=e=>{if(e.pointerId!==pid)return;pid=null;
  if(mode!==1){mode=0;return}
  mode=0;dragging=false;sup=true;setTimeout(()=>sup=false,80);
  const x=w._x;let to=0;
  if(x<0&&x<-w._wl*.4)to=-w._wl;else if(x>0&&x>w._wr*.4)to=w._wr;
  if(to){setX(w,to,true);openW=w;openId=u.id;openSide=to<0?-1:1}else closeW(w);
  if(pend){pend=false;renderList()}};
 row.addEventListener('pointerup',end);row.addEventListener('pointercancel',end);
 /* тап по открытой строке закрывает её, а не открывает чат */
 w.addEventListener('click',e=>{
  if(sup){e.stopPropagation();e.preventDefault();return}
  if(e.target.closest('.swb'))return;
  if(w._x!==0){e.stopPropagation();e.preventDefault();closeW(w)}},true);
 /* правая кнопка мыши / долгое нажатие на Android: то же самое списком */
 w.addEventListener('contextmenu',e=>{e.preventDefault();choice(dn(u),[...L,...Rr].map(a=>[t(a.l),a.f]))})}

/* ---------- сборка списка ---------- */
let showArch=false;
const spRow=(ic,ti,sub,dot,f)=>{const d=H('div',{className:'u',onclick:f},H('div',{className:'av',textContent:ic}),
 H('div',{style:'min-width:0'},H('div',{className:'nm',textContent:ti}),H('div',{className:'sb',textContent:sub})));
 if(dot)d.append(H('div',{className:'dot'}));return d};

function post(){
 if(tab!=='chats')return;
 const box=$('list'),q=$('search').value.trim(),main=cat==='all'&&!q,d=dat();
 let rows=[...box.children].filter(c=>c.classList.contains('u')).map(r=>({r,u:(r.querySelector('.av')||{})._u})).filter(x=>x.u);
 /* новое входящее сообщение возвращает чат из архива (если не заглушен) */
 rows.forEach(({u})=>{if(u.cloud||!isA(u.id))return;const lm=last(u.id);
  if(lm&&lm.sender_id!==me.id&&new Date(lm.created_at).getTime()>d.arch[u.id]&&!isMu(u)){delete d.arch[u.id];put()}});
 const arc=rows.filter(x=>!x.u.cloud&&isA(x.u.id));
 if(main){
  if(showArch&&!arc.length){showArch=false;return renderList()}
  const gone=showArch?rows.filter(x=>!arc.includes(x)):arc;
  gone.forEach(x=>x.r.remove());rows=rows.filter(x=>!gone.includes(x))}
 rows.forEach(x=>{const{r,u}=x;x.n=r;
  const pin=!u.cloud&&d.pin.includes(u.id),mu=!u.cloud&&isMu(u),nm=r.querySelector('.nm');
  if(nm&&(pin||mu))nm.append(H('span',{className:'swi',textContent:(pin?'📌':'')+(mu?'🔕':'')}));
  if(mu)r.classList.add('mu');
  if(u.cloud)return;
  const{L,R:Rr}=actsOf(u),w=H('div',{className:'swr'});
  r.replaceWith(w);
  const bt=a=>H('button',{type:'button',className:'swb c-'+a.c,onclick:e=>{e.stopPropagation();closeW(w);a.f()}},H('span',{textContent:a.i}),H('small',{textContent:t(a.l)}));
  w.append(H('div',{className:'swa lf'},...Rr.map(bt)),H('div',{className:'swa rt'},...L.map(bt)),r);
  w._row=r;w._x=0;w._wl=L.length*72;w._wr=Rr.length*72;
  attach(w,r,u,L,Rr);x.n=w;
  if(openId===u.id){setX(w,openSide<0?-w._wl:w._wr,false);openW=w}});
 /* порядок: Облако, закреплённые, остальные */
 const cl=rows.filter(x=>x.u.cloud),
  pn=rows.filter(x=>!x.u.cloud&&d.pin.includes(x.u.id)).sort((a,b)=>d.pin.indexOf(a.u.id)-d.pin.indexOf(b.u.id)),
  rest=rows.filter(x=>!cl.includes(x)&&!pn.includes(x));
 [...cl,...pn,...rest].forEach(x=>box.append(x.n));
 /* строка «Архив» */
 if(main){
  if(showArch)box.prepend(spRow('←',t('sw_arch_t'),t('sw_back'),false,()=>{showArch=false;renderList()}));
  else if(arc.length)box.prepend(spRow('📦',t('sw_arch_t')+' ('+arc.length+')',arc.map(x=>dn(x.u)).join(', '),arc.some(x=>unread.has(x.u.id)),()=>{showArch=true;renderList()}))}}

const _rl=renderList;
renderList=function(){
 if(dragging){pend=true;return}
 if(me)dat().unr.forEach(id=>{if(!peer||peer.id!==id)unread.add(id)});
 _rl();
 if(me)try{post()}catch(e){console.error(e)}};

/* открыли чат — снимаем ручную пометку «не прочитано» */
const _oc=openChat;
openChat=async function(u){const r=await _oc(u);if(me&&peer&&peer.id===u.id&&has('unr',u.id))tog('unr',u.id,false);return r};

renderList();
})();
</script>

const TPL={
js:"// XINH bot (JavaScript). Runs on every message. Return a string.\nfunction onMessage(text, user) {\n  if (text === '/start') return 'Hello, ' + user + '!';\n  return 'You said: ' + text;\n}\n",
py:"# XINH bot (Python). Runs on every message. Return a string.\ndef on_message(text, user):\n    if text == '/start':\n        return 'Hello, ' + user + '!'\n    return 'You said: ' + text\n"};

/* ---------- состояние ---------- */
let bs=null,bsFor=null,bots=[],meta={users:0,verified:true},flow=null,sid=0;
const SKEY=()=>'xinh_cb_'+me.id;
function ld(){if(!me)return;if(bsFor===me.id&&bs)return;bsFor=me.id;bots=[];flow=null;
 try{bs=JSON.parse(localStorage.getItem(SKEY())||'null')}catch(e){bs=null}
 if(!bs||!Array.isArray(bs.m)||!B[bs.lang])bs={started:false,lang:'ru',m:[]}}
const sv=()=>{try{bs.m=bs.m.slice(-60);localStorage.setItem(SKEY(),JSON.stringify(bs))}catch(e){}};
const lcA=()=>B[S.lang]?S.lang:(S.lang==='xx'?'ru':'en');
const hl=()=>(bs&&bs.started)?bs.lang:lcA();
const tr=(k,a,lg)=>{lg=lg||bs.lang;const s=(B[lg]&&B[lg][k])||B.en[k]||B.ru[k]||k;
 a=Object.assign({u:(prof&&prof.username)||'user',l:LN[lg]},a||{});return s.replace(/\{(\w+)\}/g,(_,x)=>a[x]!=null?a[x]:'')};
function mtext(m){if(m.text!=null)return m.text;const a=Object.assign({},m.a||{});if(a.v)a.v=tr(a.v);return tr(m.k,a)}
function usersTxt(lg){const n=meta.users||0;
 if(lg==='ru'||lg==='be'){const a=n%100,b=n%10,f=lg==='ru'?['пользователь','пользователя','пользователей']:['карыстальнік','карыстальнікі','карыстальнікаў'];return n+' '+(a>10&&a<20?f[2]:b===1?f[0]:b>1&&b<5?f[1]:f[2])}
 if(lg==='vi')return n+' người dùng';if(lg==='zh')return n+' 位用户';return n+(n===1?' user':' users')}
const logo=()=>{const c=(S.accent||'')[0]==='#'?S.accent:(ACC[S.accent]||'#ff1f3d');
 return 'data:image/svg+xml,'+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#050505'/><text x='50' y='71' font-size='62' text-anchor='middle' fill='"+c+"' font-family='Arial Black,Arial' font-weight='900'>X</text></svg>")};
const BOT=()=>({id:BID,bot:true,is_bot:true,username:'creator_bot',display_name:'XINH Creator',verified:meta.verified,avatar_url:logo()});

/* ---------- сообщения ---------- */
const uid=()=>Date.now()+'_'+(sid++);
const draw=()=>{if(peer&&peer.bot){renderMsgs();renderList()}};
function say(k,a,kb){bs.m.push({id:uid(),k,a,kb,ts:Date.now()});sv();draw()}
function sayT(text,kb){bs.m.push({id:uid(),text,kb,ts:Date.now()});sv();draw()}
function mine(text){bs.m.push({id:uid(),me:1,text,ts:Date.now()});sv()}
const KB={
 menu:()=>[[{k:'btn_new',d:'new'}],[{k:'btn_edit',d:'edit'}],[{k:'btn_set',d:'set'}]],
 cancel:()=>[[{k:'btn_cancel',d:'menu'}]],
 lang:()=>[[{t:'Русский '+LF.ru,d:'lang:ru'},{t:'English '+LF.en,d:'lang:en'}],[{t:'Tiếng Việt '+LF.vi,d:'lang:vi'},{t:'中文 '+LF.zh,d:'lang:zh'}],[{t:'Беларуская '+LF.be,d:'lang:be'}]]};
const backKb=id=>[[{k:'btn_back',d:'b:'+id}]];

function renderBot(){const box=$('msgs');ld();box.textContent='';$('pin').classList.add('hide');
 if(!bs.started){const L=lcA();
  box.append(H('div',{className:'empty'},H('b',{textContent:tr('intro_h',null,L),style:'font-size:17px;display:block;margin-bottom:10px'}),
   ...[1,2,3].map(i=>H('div',{textContent:'• '+tr('intro_'+i,null,L),style:'margin:4px 0'}))));return}
 let lk=-1;bs.m.forEach((m,i)=>{if(!m.me&&m.kb)lk=i});
 bs.m.forEach((m,i)=>{const d=H('div',{className:'m bm'+(m.me?' me':'')});rich(d,mtext(m));
  if(i===lk){const kb=H('div',{className:'bkb'});
   m.kb.forEach(r=>kb.append(H('div',{className:'brow'},...r.map(b=>H('button',{type:'button',textContent:b.t||tr(b.k),onclick:()=>act(b.d)})))));d.append(kb)}
  d.append(H('time',{textContent:new Date(m.ts).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'})}));box.append(d)});
 box.scrollTop=box.scrollHeight}

/* ---------- запуск кода бота (только на вашем устройстве, в изолированном Worker) ---------- */
function runCode(lang,code,text,user){return new Promise((res,rej)=>{
 const js="self.onmessage=async e=>{const{code,text,user}=e.data;try{const f=new Function('text','user',code+'\\n;return typeof onMessage===\"function\"?onMessage(text,user):(()=>{throw new Error(\"onMessage() not found\")})();');const r=await f(text,user);postMessage({r:r==null?'':String(r)})}catch(x){postMessage({e:String((x&&x.message)||x)})}};";
 const py="importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');let py;self.onmessage=async e=>{const{code,text,user}=e.data;try{py=py||await loadPyodide();py.globals.set('_t',text);py.globals.set('_u',user);const r=await py.runPythonAsync(code+'\\nstr(on_message(_t,_u))');postMessage({r:r==null?'':String(r)})}catch(x){postMessage({e:String((x&&x.message)||x)})}};";
 const url=URL.createObjectURL(new Blob([lang==='py'?py:js],{type:'text/javascript'})),w=new Worker(url);
 const end=()=>{clearTimeout(tm);w.terminate();URL.revokeObjectURL(url)},tm=setTimeout(()=>{end();rej(new Error('timeout'))},lang==='py'?60000:4000);
 w.onmessage=e=>{end();e.data.e?rej(new Error(e.data.e)):res(e.data.r)};w.onerror=e=>{end();rej(new Error(e.message||'worker error'))};
 w.postMessage({code,text,user})})}

/* ---------- логика бота ---------- */
async function loadBots(){const{data,error}=await sb.from('bots').select('*').eq('owner',me.id).order('created_at');if(error){say('err',{e:error.message},KB.menu());return false}bots=data||[];return true}
const gb=id=>bots.find(x=>x.id===id);
function menu(){flow=null;say('hello',null,KB.menu())}
function card(b){if(!b){menu();return}flow=null;
 say('card',{n:b.name,u:b.username,c:b.lang==='py'?'Python':'JavaScript',v:b.verified?'v_yes':'v_no',d:b.description||''},
 [[{k:'btn_name',d:'bn:'+b.id},{k:'btn_desc',d:'bd:'+b.id}],[{k:'btn_ava',d:'ba:'+b.id},{k:'btn_code',d:'bc:'+b.id}],[{k:'btn_show',d:'bs:'+b.id},{k:'btn_test',d:'bt:'+b.id}],[{k:'btn_verif',d:'bv:'+b.id}],[{k:'btn_del',d:'bx:'+b.id}],[{k:'btn_menu',d:'edit'}]])}
async function upd(id,p){const{error}=await sb.from('bots').update(p).eq('id',id);flow=null;
 if(error){say('err',{e:error.message},backKb(id));return}const b=gb(id);if(b)Object.assign(b,p);say('saved');card(b)}
async function createBot(f,lang){const{data,error}=await sb.from('bots').insert({username:f.user,name:f.name,lang,code:TPL[lang]}).select().single();
 if(error){if(error.code==='23505'){flow={s:'user',name:f.name};say('taken',null,KB.cancel())}else{flow=null;say('err',{e:error.message},KB.menu())}return}
 flow=null;bots.push(data);say('created',{n:data.name,u:data.username},[[{k:'btn_edit',d:'b:'+data.id}],[{k:'btn_menu',d:'menu'}]])}

async function act(d){ld();if(!bs.started)return;const[c,x]=d.split(':');
 if(c==='lang'){if(!B[x])return;bs.lang=x;mine(LN[x]+' '+LF[x]);menu();setHead();return}
 if(c==='menu'||c==='cancel'){menu();return}
 if(c==='new'){flow={s:'name'};say('new_name',null,KB.cancel());return}
 if(c==='nl'){if(flow&&flow.s==='nl')await createBot(flow,x);return}
 if(c==='edit'){flow=null;if(!(await loadBots()))return;
  if(!bots.length){say('no_bots',null,[[{k:'btn_new',d:'new'}],[{k:'btn_menu',d:'menu'}]]);return}
  say('pick_bot',null,[...bots.map(b=>[{t:(b.verified?'✓ ':'')+b.name+' @'+b.username,d:'b:'+b.id}]),[{k:'btn_menu',d:'menu'}]]);return}
 if(c==='set'){flow=null;say('set_t',null,[[{k:'btn_lang',d:'setlang'}],[{k:'btn_menu',d:'menu'}]]);return}
 if(c==='setlang'){say('pick_lang',null,KB.lang());return}
 if(c==='exit'){const f=flow;flow=null;card(f&&gb(f.id));return}
 if(!bots.length)await loadBots();const b=gb(x);if(!b){menu();return}
 if(c==='b'){card(b);return}
 if(c==='bn'){flow={s:'bn',id:x};say('ask_name',null,backKb(x));return}
 if(c==='bd'){flow={s:'bd',id:x};say('ask_desc',null,backKb(x));return}
 if(c==='bc'){flow={s:'bc',id:x};say('ask_code',null,backKb(x));return}
 if(c==='ba'){flow={s:'ava',id:x};say('ask_ava',null,backKb(x));return}
 if(c==='bs'){sayT(tr('code_is')+'\n```\n'+b.code+'\n```',backKb(x));return}
 if(c==='bt'){flow={s:'test',id:x};say('test_on',null,[[{k:'btn_exit',d:'exit'}]]);return}
 if(c==='bv'){if(b.verified){say('verif_done',null,backKb(x));return}flow={s:'bv',id:x};say('verif_ask',null,backKb(x));return}
 if(c==='bx'){say('del_conf',{u:b.username},[[{k:'btn_yes',d:'bxy:'+x},{k:'btn_cancel',d:'b:'+x}]]);return}
 if(c==='bxy'){const{error}=await sb.from('bots').delete().eq('id',x);if(error){say('err',{e:error.message},backKb(x));return}bots=bots.filter(z=>z.id!==x);flow=null;say('deleted',null,[[{k:'btn_edit',d:'edit'}],[{k:'btn_menu',d:'menu'}]])}}

async function onText(v){ld();mine(v);const f=flow;
 if(!f){say('hint',null,KB.menu());return}
 if(f.s==='name'){flow={s:'user',name:v.slice(0,40)};say('new_user',null,KB.cancel());return}
 if(f.s==='user'){const u=v.replace(/^@/,'').toLowerCase();
  if(!/^[a-z][a-z0-9_]{2,31}$/.test(u)||!/bot$/.test(u)){say('bad_user',null,KB.cancel());return}
  flow={s:'nl',name:f.name,user:u};say('new_lang',null,[[{t:'JavaScript',d:'nl:js'},{t:'Python',d:'nl:py'}]]);return}
 if(f.s==='nl'){say('new_lang',null,[[{t:'JavaScript',d:'nl:js'},{t:'Python',d:'nl:py'}]]);return}
 if(f.s==='bn'){const n=v.slice(0,40);if(n)await upd(f.id,{name:n});return}
 if(f.s==='bd'){await upd(f.id,{description:v.slice(0,300)});return}
 if(f.s==='bc'){const mm=/^```[\w+-]*\n?([\s\S]*?)\n?```$/.exec(v.trim()),code=(mm?mm[1]:v).slice(0,20000);await upd(f.id,{code});return}
 if(f.s==='bv'){const{error}=await sb.from('bot_verif_requests').insert({bot_id:f.id,owner:me.id,note:v==='-'?null:v.slice(0,500)});
  flow=null;if(error&&error.code==='23505')say('verif_dup',null,backKb(f.id));else if(error)say('err',{e:error.message},backKb(f.id));else say('verif_ok',null,backKb(f.id));return}
 if(f.s==='test'){const b=gb(f.id);if(!b){flow=null;menu();return}
  try{const r=await runCode(b.lang,b.code,v,(prof&&prof.display_name)||'user');sayT('🤖 '+(r||tr('test_empty')),[[{k:'btn_exit',d:'exit'}]])}
  catch(e){say('test_err',{e:String((e&&e.message)||e)},[[{k:'btn_exit',d:'exit'}]])}return}
 if(f.s==='ava'){say('ask_ava',null,backKb(f.id))}}

function pickAva(){const i=H('input',{type:'file',accept:'image/*'});
 i.onchange=async()=>{const f=i.files[0];if(!f||!flow||flow.s!=='ava')return;
  if(!(f.type||'').startsWith('image/')){say('e_img',null,backKb(flow.id));return}
  if(f.size>5242880){sayT(t('e_big'),backKb(flow.id));return}
  const id=flow.id,path=me.id+'/botava_'+Date.now()+'.'+((f.name.split('.').pop()||'jpg').replace(/\W/g,'').slice(0,5)||'jpg');
  const{error}=await sb.storage.from('xinh').upload(path,f,{contentType:f.type||'image/jpeg'});
  if(error){say('err',{e:error.message},backKb(id));return}
  await upd(id,{avatar_url:sb.storage.from('xinh').getPublicUrl(path).data.publicUrl})};i.click()}

/* ---------- встраивание в приложение ---------- */
/* mark_read для бота не нужен */
const _rpc=sb.rpc.bind(sb);
sb.rpc=(n,p,...r)=>(n==='mark_read'&&p&&String(p.pid).startsWith('bot:'))?Promise.resolve({data:null,error:null}):_rpc(n,p,...r);

async function loadMeta(){try{const{data,error}=await sb.rpc('bot_info',{uname:'creator_bot'}),r=data&&data[0];
 if(!error&&r)meta={users:Number(r.users)||0,verified:!!r.verified}}catch(e){}
 if(peer&&peer.bot){peer.verified=meta.verified;setHead()}renderList()}

/* кнопка «Начать» */
const stBtn=H('button',{type:'button',className:'solid'}),bar=H('div',{id:'botbar',className:'hide'},stBtn);$('form').after(bar);
function ui(){const isb=!!(peer&&peer.bot);ld();bar.classList.toggle('hide',!(isb&&!bs.started));
 if(isb){$('form').classList.toggle('hide',!bs.started);stBtn.textContent=tr('start',null,lcA())}}
stBtn.onclick=()=>{ld();bs.started=true;bs.m=[];flow=null;sv();_rpc('bot_start',{uname:'creator_bot'}).then(loadMeta);say('pick_lang',null,KB.lang());ui();setHead();$('txt').focus()};
$('back').addEventListener('click',()=>bar.classList.add('hide'));

const _oc=openChat;
openChat=async function(u){const r=await _oc(u);if(peer&&peer.id===u.id){ui();if(u.bot){loadMeta();renderMsgs()}}return r};

const _rm=renderMsgs;

const _sh=setHead;

 setAv($('hav'),peer);$('hnm').textContent=peer.display_name;if(meta.verified)$('hnm').append(vb());
 $('hsb').style.color='';$('hsb').textContent=usersTxt(hl())};

const _fs=$('form').onsubmit;
$('form').onsubmit=async e=>{if(peer&&peer.bot){e.preventDefault();const v=$('txt').value.trim();if(!v)return;$('txt').value='';autoSize();onText(v);return}return _fs.call($('form'),e)};

/* скрепка, микрофон, стикеры */
$('attach').onclick=()=>{if(peer&&peer.bot){ld();if(flow&&flow.s==='ava')pickAva();else say('e_file');return}$('file').click()};
const _mic=$('mic').onclick;
$('mic').onclick=function(e){if(peer&&peer.bot){say('e_file');return}return _mic.call(this,e)};
const _os=openStk;openStk=async function(){if(peer&&peer.bot)return;return _os.apply(this,arguments)};

/* профиль бота */
const _sp=showProfile;
showProfile=function(){const cd=$('pview').firstElementChild;
 if(!peer||!peer.bot){cd.querySelectorAll(':scope>[data-bh]').forEach(e=>{e.style.display='';delete e.dataset.bh});return _sp.apply(this,arguments)}
 [...cd.children].forEach(e=>{if(e.classList.contains('prow')||e.id==='vClose')return;e.dataset.bh='1';e.style.display='none'});
 ld();setAv($('vAv'),peer);$('vName').textContent=peer.display_name;if(meta.verified)$('vName').append(vb());
 $('vInfo').textContent=['@'+peer.username,usersTxt(hl()),tr('about_bot',null,hl())].join('\n');$('pview').classList.remove('hide')};
$('hav').onclick=$('hnm').onclick=showProfile;

/* строка бота в списке чатов */
const _rl=renderList;
renderList=function(){_rl();if(!me)return;try{botRow()}catch(e){console.error(e)}};
function botRow(){if(tab!=='chats'||!(cat==='all'||cat==='bots'))return;
 const q=$('search').value.toLowerCase().trim().replace(/^@/,'');if(q&&!'xinh creator creator_bot'.includes(q))return;
 ld();const box=$('list');box.querySelectorAll('.empty').forEach(e=>e.remove());
 const lm=[...bs.m].reverse().find(m=>!m.me),sub=(bs.started&&lm)?mtext(lm).split('\n')[0]:'@creator_bot',u=BOT(),av=H('div',{className:'av'});setAv(av,u);
 const nm=H('div',{className:'nm',textContent:u.display_name});if(meta.verified)nm.append(vb());nm.append(H('span',{className:'badge',textContent:'bot'}));
 box.prepend(H('div',{className:'u'+(peer&&peer.id===BID?' on':''),onclick:()=>openChat(BOT())},av,H('div',{style:'min-width:0'},nm,H('div',{className:'sb',textContent:sub}))))}

if(me){loadMeta()}else{const _b=boot;boot=async function(u){await _b(u);loadMeta()}}
})();

<script>
(()=>{
const bm={},ub={};let ch=null,tmp=0,st=null;
const PID=id=>'bot:'+id;
const lc=()=>['ru','be','vi','zh'].includes(S.lang)?S.lang:(S.lang==='xx'?'ru':'en');
const UB=b=>({id:PID(b.id),ubot:true,rid:b.id,username:b.username,display_name:b.name,avatar_url:b.avatar_url,verified:!!b.verified,description:b.description,users:Number(b.users)||0});
function usersTxt(n){const l=lc();n=n||0;
 if(l==='ru'||l==='be'){const a=n%100,b=n%10,f=l==='ru'?['пользователь','пользователя','пользователей']:['карыстальнік','карыстальнікі','карыстальнікаў'];return n+' '+(a>10&&a<20?f[2]:b===1?f[0]:b>1&&b<5?f[1]:f[2])}
 if(l==='vi')return n+' người dùng';if(l==='zh')return n+' 位用户';return n+(n===1?' user':' users')}

/* ---------- загрузка и realtime ---------- */
async function loadUB(){Object.keys(bm).forEach(k=>delete bm[k]);Object.keys(ub).forEach(k=>delete ub[k]);
 const{data,error}=await sb.from('bot_messages').select('*').order('id',{ascending:false}).limit(300);if(error)return;
 (data||[]).reverse().forEach(m=>(bm[m.bot_id]=bm[m.bot_id]||[]).push(m));
 const ids=Object.keys(bm);
 if(ids.length){const{data:bs}=await sb.rpc('bot_public_ids',{ids});(bs||[]).forEach(r=>{ub[r.id]=UB(r)})}
 renderList()}
async function loadChat(id){const{data,error}=await sb.from('bot_messages').select('*').eq('bot_id',id).order('id',{ascending:false}).limit(200);if(error)return;
 const keep=(bm[id]||[]).filter(m=>m.tmp);bm[id]=[...data.reverse(),...keep];if(peer&&peer.rid===id)renderMsgs()}
function subUB(){if(ch){sb.removeChannel(ch);ch=null}
 ch=sb.channel('ub-'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'bot_messages',filter:'user_id=eq.'+me.id},p=>{
  const m=p.new,a=bm[m.bot_id]=bm[m.bot_id]||[];if(a.some(x=>x.id===m.id))return;a.push(m);
  const id=PID(m.bot_id),here=peer&&peer.id===id;
  if(m.from_bot&&!(here&&!document.hidden)){unread.add(id);if(S.n_dm!==false){fx();if(ub[m.bot_id])toast(ub[m.bot_id],m.body.slice(0,80))}}
  renderList();if(here)renderMsgs()}).subscribe()}

/* ---------- чат ---------- */
const _rm=renderMsgs;
renderMsgs=function(){if(!(peer&&peer.ubot))return _rm.apply(this,arguments);
 const box=$('msgs'),l=bm[peer.rid]||[];box.textContent='';$('pin').classList.add('hide');
 if(!l.length){box.append(H('div',{className:'empty',textContent:peer.description||t('nochat')}));return}
 l.forEach(m=>{const d=H('div',{className:'m'+(m.from_bot?'':' me')});rich(d,m.body);
  d.append(H('time',{textContent:new Date(m.created_at).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'})}));box.append(d)});
 box.scrollTop=box.scrollHeight};

const _fs=$('form').onsubmit;
$('form').onsubmit=async e=>{if(!(peer&&peer.ubot))return _fs.call($('form'),e);e.preventDefault();
 const v=$('txt').value.trim();if(!v)return;$('txt').value='';autoSize();
 const p=peer,a=bm[p.rid]=bm[p.rid]||[],tm={id:'t'+(++tmp),tmp:1,bot_id:p.rid,from_bot:false,body:v.slice(0,4000),created_at:new Date().toISOString()};
 a.push(tm);ub[p.rid]=p;sent();renderList();renderMsgs();
 const{data,error}=await sb.rpc('bot_send',{uname:p.username,txt:v});
 if(error){const i=a.indexOf(tm);if(i>=0)a.splice(i,1);alert(t('notsent')+error.message);renderMsgs();return}
 if(a.some(x=>x.id===data&&x!==tm)){const i=a.indexOf(tm);if(i>=0)a.splice(i,1)}else{tm.id=data;delete tm.tmp}
 renderList();if(peer&&peer.id===p.id)renderMsgs()};

const _oc=openChat;
openChat=async function(u){const r=await _oc(u);
 if(peer&&peer.id===u.id&&u.ubot){['attach','mic'].forEach(i=>$(i).classList.add('hide'));ub[u.rid]=u;renderMsgs();await loadChat(u.rid)}
 return r};
const _os=openStk;openStk=async function(){if(peer&&peer.ubot)return;return _os.apply(this,arguments)};

/* ---------- шапка и профиль ---------- */
const _sh=setHead;
setHead=function(){_sh();if(!peer||!peer.ubot)return;
 setAv($('hav'),peer);$('hnm').textContent=peer.display_name;if(peer.verified)$('hnm').append(vb());
 $('hsb').style.color='';$('hsb').textContent=usersTxt(peer.users)};
const _sp=showProfile;
showProfile=function(){if(!peer||!peer.ubot)return _sp.apply(this,arguments);
 const cd=$('pview').firstElementChild;
 [...cd.children].forEach(e=>{if(e.classList.contains('prow')||e.id==='vClose')return;e.dataset.bh='1';e.style.display='none'});
 setAv($('vAv'),peer);$('vName').textContent=peer.display_name;if(peer.verified)$('vName').append(vb());
 $('vInfo').textContent=['@'+peer.username,usersTxt(peer.users),peer.description||''].filter(Boolean).join('\n');$('pview').classList.remove('hide')};
$('hav').onclick=$('hnm').onclick=showProfile;

/* ---------- строки в списке и поиск по @username ---------- */
function row(u,sub){const av=H('div',{className:'av'});setAv(av,u);
 const nm=H('div',{className:'nm',textContent:u.display_name});if(u.verified)nm.append(vb());nm.append(H('span',{className:'badge',textContent:'bot'}));
 const d=H('div',{className:'u'+(peer&&peer.id===u.id?' on':''),onclick:()=>openChat(u)},av,H('div',{style:'min-width:0'},nm,H('div',{className:'sb',textContent:sub})));
 if(unread.has(u.id))d.append(H('div',{className:'dot'}));return d}
const _rl=renderList;
renderList=function(){_rl();if(!me)return;try{rows()}catch(e){console.error(e)}};
function rows(){if(tab!=='chats'||!(cat==='all'||cat==='bots'))return;
 const q=$('search').value.toLowerCase().trim().replace(/^@/,''),box=$('list');
 const l=Object.keys(bm).filter(id=>ub[id]&&bm[id].length&&(!q||(ub[id].display_name+' '+ub[id].username).toLowerCase().includes(q)))
  .sort((a,b)=>bm[b][bm[b].length-1].created_at<bm[a][bm[a].length-1].created_at?-1:1);
 if(!l.length)return;box.querySelectorAll('.empty').forEach(e=>e.remove());
 const rs=l.map(id=>{const m=bm[id][bm[id].length-1];return row(ub[id],(m.from_bot?'':'→ ')+m.body.split('\n')[0])});
 const cr=[...box.children].find(e=>e.classList.contains('u')&&/^XINH Creator/.test((e.querySelector('.nm')||{}).textContent||''));
 cr?cr.after(...rs):box.prepend(...rs)}
$('search').addEventListener('input',()=>{clearTimeout(st);
 const q=$('search').value.trim().toLowerCase().replace(/^@/,'');
 if(!/^[a-z][a-z0-9_]{2,31}$/.test(q)||!/bot$/.test(q)||q==='creator_bot')return;
 st=setTimeout(async()=>{const{data}=await sb.rpc('bot_public',{uname:q}),r=data&&data[0];if(!r||bm[r.id])return;
  $('list').querySelectorAll('.empty').forEach(e=>e.remove());
  $('list').prepend(row(UB({...r,username:q}),'@'+q))},300)});

/* ---------- запуск ---------- */
async function start(){await loadUB();subUB()}
if(me)start();else{const _b=boot;boot=async function(u){await _b(u);await start()}}
})();
</script>

/* ---------- дни недели в разделителях дат ---------- */
const _dl=dayLabel;
dayLabel=function(ts){
 const d=new Date(ts),n=new Date(),
  a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate()),k=Math.round((b-a)/864e5);
 if((S.lang==='xx'||S.lang==='nr')&&k>2&&k<7)return t('wd'+d.getDay());
 return _dl(ts)};

<script>
(()=>{
const RU={rg_next:'Далее',rg_back:'Назад',rg_prof_t:'Создайте профиль',rg_avatar:'Нажмите на круг, чтобы добавить фото',rg_set_t:'Настройте мессенджер под себя',
 rg_opt:'(необязательно)',rg_gender:'Пол',rg_look:'Оформление',
 rg_birth_d:'Мы просим указать дату рождения, чтобы Ваши контакты знали, когда вас поздравить.',
 rg_reg_d:'Мы просим указать страну проживания, для того, чтобы знать какой контент Вам лучше предоставлять.',
 rg_gen_d:'Мы просим указать пол для того, чтобы собеседник знал как к вам обращаться.',
 rg_creating:'Создаем ваш профиль',rg_done:'Ваш аккаунт создан',rg_email_taken:'Эта почта уже зарегистрирована.'};
const EN={rg_next:'Next',rg_back:'Back',rg_prof_t:'Create your profile',rg_avatar:'Tap the circle to add a photo',rg_set_t:'Set up the messenger your way',
 rg_opt:'(optional)',rg_gender:'Gender',rg_look:'Appearance',
 rg_birth_d:'We ask for your date of birth so your contacts know when to congratulate you.',
 rg_reg_d:'We ask for your country of residence to know what content suits you best.',
 rg_gen_d:'We ask for your gender so the person you chat with knows how to address you.',
 rg_creating:'Creating your profile',rg_done:'Your account is created',rg_email_taken:'This email is already registered.'};
Object.assign(I18.ru,RU);Object.assign(I18.en,EN);
if(I18.xx)Object.assign(I18.xx,RU);if(I18.nr)Object.assign(I18.nr,RU);

const R={step:1,email:'',pass:'',av:null,name:'',user:'',about:'',birth:'',region:'',gender:''};
let hold=false,held=null;
const root=H('div',{id:'rg',className:'auth hide'});document.body.append(root);

/* шаг 1 — старая форма: только почта и пароли */
['rgName'].forEach(i=>{$(i).removeAttribute('required');$(i).classList.add('hide')});
$('rgUser').removeAttribute('required');$('rgUser').closest('.pfx').classList.add('hide');
$('fReg').onsubmit=e=>{e.preventDefault();
 const em=$('rgEmail').value.trim(),p=$('rgPass').value;
 if(!em||p.length<6){$('rgErr').textContent=t('e_fill');return}
 if(p!==$('rgPass2').value){$('rgErr').textContent=t('e_match');return}
 $('rgErr').textContent='';R.email=em;R.pass=p;go(2)};

function show(){showAuth('x');$('gear').classList.add('hide');root.classList.remove('hide')}
function go(n){R.step=n;if(n===1){root.classList.add('hide');showAuth('reg');return}show();render()}

const pData=()=>({name:R.name,user:R.user,about:R.about,birth:R.birth,region:R.region,gender:R.gender,avatar:R.av});
function squash(f){return new Promise(res=>{const u=URL.createObjectURL(f),i=new Image();
 i.onload=()=>{const s=Math.min(i.width,i.height),z=Math.min(400,s),c=document.createElement('canvas');c.width=c.height=z;
  c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,z,z);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85))};
 i.onerror=()=>{URL.revokeObjectURL(u);res(null)};i.src=u})}

function render(){root.textContent='';
 const c=H('div',{className:'card'},H('div',{className:'logo',textContent:'XINH'}),
  H('div',{className:'rgd'},[2,3].map(n=>H('i',{className:n===R.step?'on':''}))));
 c.append(...(R.step===2?step2():step3()));root.append(c)}

function step2(){
 const fi=H('input',{type:'file',accept:'image/*',className:'hide'});
 fi.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const d=await squash(f);if(d){R.av=d;render()}};
 const avb=H('div',{className:'av avb',onclick:()=>fi.click()});
 if(R.av)avb.append(H('img',{src:R.av,alt:''}));else avb.textContent='📷';
 const nm=H('input',{value:R.name,maxLength:40,placeholder:t('name'),oninput:e=>{R.name=e.target.value}});
 const us=H('input',{value:R.user,maxLength:20,placeholder:t('username'),autocomplete:'off',autocapitalize:'none'});
 us.oninput=()=>{us.value=us.value.replace(/[^a-zA-Z0-9_]/g,'').toLowerCase();R.user=us.value};
 const ab=H('textarea',{className:'ta',rows:3,maxLength:200,placeholder:t('about_ph'),value:R.about,oninput:e=>{R.about=e.target.value}});
 const err=H('div',{className:'err'});
 const nx=H('button',{type:'button',className:'solid',textContent:t('rg_next')});
 nx.onclick=async()=>{
  if(!R.name.trim()){err.textContent=t('e_name');return}
  if(!/^[a-z0-9_]{3,20}$/.test(R.user)){err.textContent=t('e_user');return}
  nx.disabled=true;err.textContent='…';
  try{const{data:free}=await sb.rpc('username_free',{u:R.user});if(free===false){err.textContent=t('e_taken');nx.disabled=false;return}}catch(e){}
  R.name=R.name.trim();go(3)};
 return[H('h2',{textContent:t('rg_prof_t')}),avb,fi,H('div',{className:'lbl',style:'text-align:center',textContent:t('rg_avatar')}),
  nm,H('div',{className:'pfx'},H('span',{textContent:'@'}),us),ab,err,nx,
  H('button',{type:'button',className:'link',textContent:t('rg_back'),onclick:()=>go(1)})]}

function step3(){
 const lb=(k,opt)=>H('div',{className:'lbl',textContent:t(k)+(opt?' '+t('rg_opt'):'')}),
  ds=k=>H('div',{className:'lbl',style:'font-size:12px',textContent:t(k)});
 const bd=H('input',{type:'date',value:R.birth,max:new Date().toISOString().slice(0,10),onchange:e=>{R.birth=e.target.value}});
 const rg=H('select');[...$('pRegion').options].forEach(o=>rg.append(new Option(o.textContent,o.value)));rg.value=R.region;rg.onchange=()=>{R.region=rg.value};
 const gd=SEL([['',t('g_none')],['m',t('g_m')],['f',t('g_f')],['o',t('g_o')]],R.gender,v=>{R.gender=v});
 const th=H('div',{className:'seg2'},[['dark','dark'],['light','light']].map(([m,k])=>
  H('button',{type:'button',className:m===S.mode?'on':'',style:'flex:1',textContent:t(k),onclick:()=>{S.mode=m;save();applyAll();render()}})));
 const ac=H('div',{className:'seg',style:'justify-content:space-between;flex-wrap:nowrap'},Object.keys(ACC).map(k=>{
  const b=H('button',{type:'button',className:'sw'+(k===S.accent?' on':''),onclick:()=>{S.accent=k;save();applyAll();render()}});
  b.style.setProperty('--c',ACC[k]);b.setAttribute('aria-label',t(k));return b}));
 const lg=SEL([...$('selLang').options].map(o=>[o.value,o.textContent]),S.lang,v=>{S.lang=v;save();applyAll();render()});
 const done=H('button',{type:'button',className:'solid',textContent:t('signup'),onclick:create});
 return[H('h2',{textContent:t('rg_set_t')}),
  lb('birth',1),bd,ds('rg_birth_d'),
  lb('region',1),rg,ds('rg_reg_d'),
  lb('rg_gender',1),gd,ds('rg_gen_d'),
  lb('rg_look'),th,ac,lb('lang'),lg,done,
  H('button',{type:'button',className:'link',textContent:t('rg_back'),onclick:()=>go(2)})]}

/* применение профиля после регистрации */
async function applyProfile(uid,p){let av=null;
 if(p.avatar){try{const blob=await(await fetch(p.avatar)).blob(),path=uid+'/avatar_'+Date.now()+'.jpg';
  const{error}=await sb.storage.from('xinh').upload(path,blob,{contentType:'image/jpeg'});
  if(!error)av=sb.storage.from('xinh').getPublicUrl(path).data.publicUrl}catch(e){}}
 const u={display_name:p.name,username:p.user,gender:p.gender||null,birthdate:p.birth||null,region:p.region||null,about:(p.about||'').trim()||null};
 if(av)u.avatar_url=av;await sb.from('profiles').update(u).eq('id',uid)}

async function signup(){hold=true;
 const{data,error}=await sb.auth.signUp({email:R.email,password:R.pass,options:{data:{display_name:R.name,username:R.user}}});
 if(error){hold=false;return{err:error.message}}
 if(data.user&&data.user.identities&&!data.user.identities.length){hold=false;return{err:t('rg_email_taken')}}
 let s=data.session;
 if(!s){const r=await sb.auth.signInWithPassword({email:R.email,password:R.pass});s=r.data&&r.data.session}
 if(!s){hold=false;try{localStorage.setItem('xinh_regpend',JSON.stringify({email:R.email.toLowerCase(),p:pData()}))}catch(e){}return{confirm:true}}
 await applyProfile(s.user.id,pData());held=s.user;return{ok:true}}

async function create(){R.step=4;root.textContent='';
 root.append(H('div',{className:'card rgc'},H('div',{className:'logo',textContent:'XINH'}),H('div',{className:'rgsp'}),H('h2',{textContent:t('rg_creating')})));
 const wait=new Promise(r=>setTimeout(r,4000));let res;
 try{res=await signup()}catch(e){hold=false;res={err:(e&&e.message)||'error'}}
 await wait;
 if(res.err){root.classList.add('hide');showAuth('reg');$('rgErr').textContent=res.err;return}
 if(res.confirm){root.classList.add('hide');$('confTxt').textContent=t('conf_txt').replace('{e}',R.email);$('liEmail').value=R.email;showAuth('confirm');return}
 root.textContent='';
 root.append(H('div',{className:'card rgc'},H('div',{className:'logo',textContent:'XINH'}),H('div',{className:'rgok',textContent:'✓'}),H('h2',{textContent:t('rg_done')}),
  H('button',{type:'button',className:'solid',textContent:t('signin'),style:'width:100%',onclick:()=>{hold=false;root.classList.add('hide');boot(held)}})))}

/* пока идёт регистрация, не пускаем в приложение раньше времени */
async function applyPending(u){let p=null;try{p=JSON.parse(localStorage.getItem('xinh_regpend')||'null')}catch(e){}
 if(!p||!u||(u.email||'').toLowerCase()!==p.email)return;
 try{localStorage.removeItem('xinh_regpend')}catch(e){}await applyProfile(u.id,p.p)}
const _b=boot;
boot=async function(u){if(hold){held=u;return}try{await applyPending(u)}catch(e){}return _b.apply(this,arguments)};
})();
</script>

<script>
(()=>{
const RU={vr_voice:'Голосовое сообщение',vr_video:'Видеосообщение',vr_hint:'Отпустите — отправить · влево — отмена',vr_cancel:'Отпустите, чтобы отменить',e_cam:'Нет доступа к камере.',vn_lbl:'Видеосообщение'};
const EN={vr_voice:'Voice message',vr_video:'Video message',vr_hint:'Release to send · slide left to cancel',vr_cancel:'Release to cancel',e_cam:'No camera access.',vn_lbl:'Video message'};
Object.assign(I18.ru,RU);Object.assign(I18.en,EN);
if(I18.xx)Object.assign(I18.xx,RU);if(I18.nr)Object.assign(I18.nr,RU);

const MAXV=60,MAXA=300;
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
let mode='voice';try{mode=localStorage.getItem('xinh_recmode')==='video'?'video':'voice'}catch(e){}

/* ---------- кнопка записи ---------- */
const vrec=H('button',{type:'button',id:'vrec',className:'ic'});
vrec.oncontextmenu=e=>e.preventDefault();
$('sendBtn').before(vrec);
$('mic').onclick=null;
function paintMode(){vrec.textContent=mode==='video'?'🎥':'🎤';vrec.setAttribute('aria-label',t(mode==='video'?'vr_video':'vr_voice'))}
function toggleMode(){mode=mode==='voice'?'video':'voice';try{localStorage.setItem('xinh_recmode',mode)}catch(e){}paintMode();
 try{vrec.animate([{transform:'scale(.6)'},{transform:'scale(1)'}],{duration:240})}catch(e){}}
paintMode();

/* ---------- что показывать: отправить или запись ---------- */
function sync(){
 const ab=$('abar'),has=$('txt').value.trim().length>0||(ab&&!ab.classList.contains('hide'));
 const bot=!!(peer&&(peer.bot||peer.ubot)),st=!!(peer&&peer.room&&(peer.role==='owner'||peer.role==='admin')),
  nm=!!(peer&&peer.room&&peer.kind==='group'&&peer.perm_media===false&&!st),
  can=!!peer&&!bot&&!nm&&!peer.preview;
 const showSend=has||!can;
 $('sendBtn').classList.toggle('hide',!showSend);
 vrec.classList.toggle('hide',showSend&&!REC.on)}
$('txt').addEventListener('input',sync);
$('form').addEventListener('submit',()=>{setTimeout(sync,60);setTimeout(sync,500)});
$('back').addEventListener('click',()=>setTimeout(sync,60));
setInterval(sync,400);

/* ---------- запись ---------- */
const REC={on:false,holding:false,kind:'voice',mr:null,stream:null,chunks:[],t0:0,timer:null,cancel:false,discard:false};
const ov=H('div',{id:'vro',className:'hide'});document.body.append(ov);
let pill=null,tmEl=null,hintEl=null;
function showOv(kind,stream){ov.textContent='';
 if(kind==='video'){const v=H('video',{autoplay:true,playsInline:true});v.muted=true;v.srcObject=stream;ov.append(H('div',{className:'vrc'},v));v.play().catch(()=>{})}
 tmEl=H('b',{textContent:'0:00'});hintEl=H('span',{className:'lbl',textContent:t('vr_hint')});
 pill=H('div',{className:'vrp'},H('i'),tmEl,hintEl);ov.append(pill);ov.classList.remove('hide')}
function hideOv(){ov.classList.add('hide');ov.textContent='';pill=tmEl=hintEl=null}
function pickMime(kind){if(kind!=='video'||!window.MediaRecorder||!MediaRecorder.isTypeSupported)return'';
 return['video/webm;codecs=vp8,opus','video/webm','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4'].find(m=>MediaRecorder.isTypeSupported(m))||''}

async function begin(){
 const kind=mode;let stream;
 try{stream=await navigator.mediaDevices.getUserMedia(kind==='video'?{audio:true,video:{facingMode:'user',width:{ideal:480},height:{ideal:480}}}:{audio:true})}
 catch(e){REC.holding=false;alert(t(kind==='video'?'e_cam':'e_mic'));return}
 if(!REC.holding){stream.getTracks().forEach(x=>x.stop());return}
 const mime=pickMime(kind),opt={audioBitsPerSecond:64000};if(mime)opt.mimeType=mime;if(kind==='video')opt.videoBitsPerSecond=1000000;
 let mr;try{mr=new MediaRecorder(stream,opt)}catch(e){try{mr=new MediaRecorder(stream)}catch(e2){stream.getTracks().forEach(x=>x.stop());REC.holding=false;alert(t('e_mic'));return}}
 REC.mr=mr;REC.stream=stream;REC.kind=kind;REC.chunks=[];REC.t0=Date.now();REC.on=true;
 mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data)};
 mr.onstop=()=>stopped(mr,kind);
 mr.start(250);
 rec=mr; /* статус «записывает…» для собеседника */
 vrec.classList.add('rec');showOv(kind,stream);
 REC.timer=setInterval(()=>{const s=Math.floor((Date.now()-REC.t0)/1000);if(tmEl)tmEl.textContent=mmss(s);
  if(s>=(kind==='video'?MAXV:MAXA)){REC.holding=false;finish(false)}},200)}

function finish(cancel){if(!REC.on||!REC.mr)return;if(cancel)REC.cancel=true;try{REC.mr.stop()}catch(e){stopped(REC.mr,REC.kind)}}

function stopped(mr,kind){
 if(!REC.on)return;
 const ms=Date.now()-REC.t0,secs=Math.max(1,Math.round(ms/1000)),cancel=REC.cancel||REC.discard,chunks=REC.chunks;
 try{REC.stream.getTracks().forEach(x=>x.stop())}catch(e){}
 clearInterval(REC.timer);hideOv();vrec.classList.remove('rec');rec=null;
 REC.on=false;REC.cancel=false;REC.discard=false;REC.mr=null;
 if(cancel||ms<800||!chunks.length)return;
 const ty=mr.mimeType||(kind==='video'?'video/webm':'audio/webm'),
  ext=ty.includes('mp4')?(kind==='video'?'mp4':'m4a'):ty.includes('ogg')?'ogg':'webm';
 if(kind==='video')sendCircle(new File(chunks,'circle.'+ext,{type:ty}),secs,ext);
 else sendFile(new File(chunks,'voice.'+ext,{type:ty}),'voice')}

/* ---------- жесты на кнопке ---------- */
let sx=0,holdT=null;
vrec.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 e.preventDefault();sx=e.clientX;REC.holding=true;REC.cancel=false;
 try{vrec.setPointerCapture(e.pointerId)}catch(_){}
 holdT=setTimeout(()=>{holdT=null;begin()},280)});
vrec.addEventListener('pointermove',e=>{if(!REC.on)return;const c=e.clientX-sx<-90;
 if(c!==REC.cancel){REC.cancel=c;if(pill)pill.classList.toggle('vrx',c);if(hintEl)hintEl.textContent=t(c?'vr_cancel':'vr_hint')}});
const up=e=>{if(!REC.holding)return;REC.holding=false;
 if(holdT){clearTimeout(holdT);holdT=null;toggleMode();return}
 finish(e.type==='pointercancel')};
vrec.addEventListener('pointerup',up);vrec.addEventListener('pointercancel',up);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&REC.on){REC.discard=true;REC.holding=false;finish(true)}});

/* ---------- отправка кружка ---------- */
async function sendCircle(f,secs,ext){
 const target=peer;if(!target||!f)return;
 if(f.size>26214400){alert(t('e_big'));return}
 const path=me.id+'/'+Date.now()+'.'+ext;
 const{error:e1}=await sb.storage.from('xinh').upload(path,f,{contentType:(f.type||'video/webm').split(';')[0]});
 if(e1){alert(t('notsent')+errTxt(e1));return}
 const url=sb.storage.from('xinh').getPublicUrl(path).data.publicUrl;
 const{data,error}=await sb.from('messages').insert({...tgt(target),...(reply?{reply_to:reply.id}:{}),body:'🎥 '+t('vn_lbl'),kind:'video',file_url:url,file_name:'circle_'+secs+'s_'+Date.now()+'.'+ext}).select().single();
 if(error){alert(t('notsent')+errTxt(error));return}
 sent();if(!msgs.some(x=>x.id===data.id)){msgs.push(data);renderList();if(peer&&peer.id===target.id)renderMsgs()}}

/* ---------- показ кружка в чате ---------- */
const CIR=/^circle_(\d+)s_/;let curVN=null;
const _fill=fill;
fill=function(d,m){
 if(m.kind==='video'&&m.file_url&&CIR.test(m.file_name||'')){
  const sec=+CIR.exec(m.file_name)[1]||0,C=301.6;
  const v=H('video',{src:m.file_url+'#t=0.1',preload:'metadata',playsInline:true});v.muted=true;
  const ring=H('div',{className:'vring',innerHTML:'<svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="48"/><circle class="pr" cx="50" cy="50" r="48" stroke-dasharray="301.6" stroke-dashoffset="301.6"/></svg>'}),
   pr=ring.querySelector('.pr'),ds=H('div',{className:'vd',textContent:mmss(sec)}),pl=H('div',{className:'vp',textContent:'▶'}),
   w=H('div',{className:'vnote'},v,ring,ds,pl);
  if(peer&&peer.protect){v.controlsList='nodownload';v.oncontextmenu=ev=>ev.preventDefault()}
  w.onclick=e=>{e.stopPropagation();
   if(v.paused){if(curVN&&curVN!==v)curVN.pause();if(typeof curA!=='undefined'&&curA)curA.pause();curVN=v;v.muted=false;v.play().catch(()=>{})}else v.pause()};
  v.onplay=()=>w.classList.add('pl');v.onpause=()=>w.classList.remove('pl');
  v.ontimeupdate=()=>{const dur=sec||(isFinite(v.duration)?v.duration:0)||1;pr.style.strokeDashoffset=C*(1-Math.min(1,v.currentTime/dur));ds.textContent=mmss(Math.max(0,Math.round(dur-v.currentTime)))};
  v.onended=()=>{w.classList.remove('pl');pr.style.strokeDashoffset=C;v.currentTime=0;ds.textContent=mmss(sec)};
  d.classList.add('vn');d.append(w);return}
 return _fill.apply(this,arguments)};

const _oc=openChat;
openChat=async function(u){const r=await _oc(u);sync();return r};
sync();
})();
</script>
