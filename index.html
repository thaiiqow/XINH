*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--ac);box-shadow:var(--glow)}
button{cursor:pointer;background:transparent;border:1px solid var(--ac);color:var(--act);border-radius:10px;padding:11px 16px;font-weight:700;letter-spacing:.04em}
button:hover,button:focus-visible{background:var(--ac);color:#000;box-shadow:var(--glow);outline:none}
button.solid{background:var(--ac);color:#000}
button.link{border:0;padding:6px;font-weight:400;letter-spacing:0;text-decoration:underline}
button.link:hover{background:none;box-shadow:none;color:var(--act)}
.logo{font:900 44px/1 "Arial Black",Impact,sans-serif;letter-spacing:.18em;color:var(--act);text-shadow:var(--glow)}
.hide{display:none!important}
.auth{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--ac) 20%,var(--bg)) 0,transparent 55%)}
.card{width:100%;max-width:380px;background:var(--p);border:1px solid var(--ac);border-radius:16px;padding:28px 22px;box-shadow:var(--glow);display:flex;flex-direction:column;gap:12px}
.card h2{font-size:18px}
.card .logo{text-align:center}
.err{color:var(--act);min-height:20px;font-size:13px}
#gear{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:3;padding:8px 12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button{flex:1}
.seg button:not(.on){border-color:var(--ln);color:var(--mt)}
.sw{width:34px;height:34px;border-radius:50%;padding:0;flex:none;background:var(--c);border:2px solid transparent;box-shadow:0 0 12px var(--c)}
.sw.on{border-color:var(--tx)}.sw:hover{background:var(--c)}
.lbl{color:var(--mt);font-size:13px}
#modal,#pview,#rmodal,#fmodal,#mm{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:20px}
#app{height:100%;display:flex}
#side{width:320px;border-right:1px solid var(--ln);background:var(--p);display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;border-bottom:1px solid var(--ln)}
.top .logo{font-size:24px}.top small{color:var(--mt);display:block;font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.top .row{display:flex;gap:6px}.top button{padding:8px 10px}
#search{margin:10px 14px;width:calc(100% - 28px)}
#list{overflow:auto;flex:1}
.u{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--ln)}
.u:hover,.u.on{background:var(--me)}
.av{width:42px;height:42px;border-radius:50%;border:1px solid var(--ac);display:grid;place-items:center;color:var(--act);font-weight:900;flex:none;box-shadow:0 0 10px color-mix(in srgb,var(--ac) 40%,transparent)}
.u .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u .sb{color:var(--mt);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:var(--glow);margin-left:auto;flex:none}
.badge{font-size:10px;border:1px solid var(--ac);color:var(--act);border-radius:6px;padding:1px 5px;margin-left:6px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln);background:var(--p)}

#msgs{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:9px 13px;border-radius:14px;word-wrap:break-word;white-space:pre-wrap;background:var(--p2);border:1px solid var(--ln)}
.m.me{align-self:flex-end;background:var(--me);border-color:var(--ac);box-shadow:0 0 10px color-mix(in srgb,var(--ac) 25%,transparent)}
.m time{display:block;font-size:10px;color:var(--mt);margin-top:3px;text-align:right}
.empty{margin:auto;color:var(--mt);text-align:center;padding:20px}
#form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--ln);background:var(--p)}
#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.quote{border-left:3px solid var(--ac);padding:2px 8px;margin-bottom:4px;color:var(--mt);font-size:13px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pin{padding:8px 14px;border-bottom:1px solid var(--ln);background:var(--p);color:var(--act);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rbar{display:flex;gap:8px;align-items:center;padding:6px 14px;border-top:1px solid var(--ln);background:var(--p);color:var(--mt)}
#rbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#rbar button{padding:4px 10px}
.mrow{display:flex;gap:8px;align-items:center;justify-content:space-between;text-align:left}.mrow button{padding:5px 9px;font-size:12px}
.tabs2{display:flex;gap:6px;padding:0 14px 8px}.tabs2 button{flex:1;padding:7px}.tabs2 button:not(.on){border-color:var(--ln);color:var(--mt)}
.mp{display:flex;gap:12px;align-items:center;min-width:230px}
.cov{width:54px;height:54px;border-radius:50%;flex:none;border:1px solid var(--ac);background:radial-gradient(circle at 35% 30%,var(--ac),#000 78%);display:grid;place-items:center;box-shadow:var(--glow)}
.cov button{width:34px;height:34px;border-radius:50%;padding:0;background:var(--bg);color:var(--act);font-size:12px}

.toast{display:flex;gap:12px;align-items:center;background:var(--p);border:1px solid var(--ac);border-radius:14px;padding:10px 12px;box-shadow:var(--glow);cursor:pointer}
.toast .av{width:40px;height:40px}.toast>div:last-child{min-width:0}.toast .nm{font-weight:700}
.toast .sb{color:var(--mt);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{max-height:92vh;overflow:auto}.card>*{flex-shrink:0}

  renderList();if(peer&&peer.id===other)renderMsgs();
  if(!m.room_id&&!users.some(x=>x.id===other))refreshUsers();
 }).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},p=>{const i=msgs.findIndex(x=>x.id===p.new.id);if(i>=0){msgs[i]=p.new;renderList();if(peer)renderMsgs()}})
 .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},p=>{msgs=msgs.filter(x=>x.id!==p.old.id);renderList();if(peer)renderMsgs()}).subscribe();
}

function renderMsgs(){

 const pm=l.filter(m=>m.pinned).pop(),pb=$('pin');pb.classList.toggle('hide',!pm);
 if(pm){pb.textContent='📌 '+(pm.body||'').slice(0,80);pb.onclick=()=>{const e=box.querySelector('[data-id="'+pm.id+'"]');if(e)e.scrollIntoView({block:'center'})}}

  if(peer.room&&peer.kind==='group'&&!own){const w=document.createElement('div');w.className='who';w.textContent=dn(users.find(x=>x.id===m.sender_id)||{display_name:''});d.append(w)}

 let e;

 else if(k==='video'){e=document.createElement('video');e.src=m.file_url;e.controls=true;e.preload='metadata';e.playsInline=true}
 else if(k==='audio'){e=player(m)}

  }

 if(e1){alert(t('notsent')+e1.message);return}
 const url=sb.storage.from('xinh').getPublicUrl(path).data.publicUrl,ty=f.type||'';
 if(!kind)kind=ty.startsWith('image/')?'image':ty.startsWith('video/')?'video':ty.startsWith('audio/')?'audio':'file';
 const{data,error}=await sb.from('messages').insert({...tgt(peer),...(reply?{reply_to:reply.id}:{}),body:kind==='voice'?'🎤':'📎 '+f.name,kind,file_url:url,file_name:f.name}).select().single();

  rec.onstop=()=>{st.getTracks().forEach(x=>x.stop());const ty=rec.mimeType||'audio/webm',ext=ty.includes('mp4')?'m4a':ty.includes('ogg')?'ogg':'webm';
   const f=new File(chunks,'voice.'+ext,{type:ty});rec=null;$('mic').classList.remove('rec');sendFile(f,'voice')};
  rec.start();$('mic').classList.add('rec')}catch(e){rec=null;alert(t('e_mic'))}};

function toast(u,txt){const d=document.createElement('div');d.className='toast';
 const av=document.createElement('div');av.className='av';setAv(av,u);
 const w=document.createElement('div'),n=document.createElement('div'),x=document.createElement('div');
 n.className='nm';n.textContent=(u?dn(u):'XINH');x.className='sb';x.textContent=txt;w.append(n,x);d.append(av,w);
 d.onclick=()=>{d.remove();if(u)openChat(u)};$('toasts').append(d);setTimeout(()=>d.remove(),5000)}
function notify(m,other){const u=users.find(x=>x.id===other)||rooms.find(x=>x.id===other),txt=S.ntext?m.body:t('newmsg');
 if(!document.hidden){toast(u,txt);return}
 if('Notification' in window&&Notification.permission==='granted'){
  const n=new Notification((u?dn(u):'XINH'),{body:txt,icon:(u&&u.avatar_url)||undefined,tag:other});
  n.onclick=()=>{window.focus();if(u)openChat(u);n.close()}}}
$('nOn').onchange=async e=>{S.notif=e.target.checked;save();if(S.notif&&'Notification' in window&&Notification.permission==='default')await Notification.requestPermission()};
$('nTxt').onchange=e=>{S.ntext=e.target.checked;save()};
[$('rgUser'),$('pUser')].forEach(i=>i.oninput=()=>{i.value=i.value.replace(/[^a-zA-Z0-9_]/g,'').toLowerCase()});
const BAD=new Set(['EU','EZ','UN','QO','XA','XB','ZZ','AC','CP','CQ','DG','EA','IC','TA']);
function regName(c){if(!c)return '';try{return new Intl.DisplayNames([S.lang==='ru'?'ru':'en'],{type:'region'}).of(c)||c}catch(e){return c}}
function buildRegions(){const sel=$('pRegion'),v=sel.value,lg=S.lang==='ru'?'ru':'en';sel.textContent='';
 const o0=document.createElement('option');o0.value='';o0.textContent=t('region');sel.append(o0);
 try{const dn=new Intl.DisplayNames([lg],{type:'region'}),A='ABCDEFGHIJKLMNOPQRSTUVWXYZ',l=[];
  for(const a of A)for(const b of A){const c=a+b;if(BAD.has(c))continue;const n=dn.of(c);if(n&&n!==c)l.push([c,n])}
  l.sort((x,y)=>x[1].localeCompare(y[1],lg));
  l.forEach(([c,n])=>{const o=document.createElement('option');o.value=c;o.textContent=n;sel.append(o)})}catch(e){}
 sel.value=v}

/* ===== КОНТАКТЫ, ГРУППЫ/КАНАЛЫ, ПЛЕЕР ===== */
async function loadRooms(){const[{data:rs},{data:cs},{data:ms},{data:hs}]=await Promise.all([sb.from('rooms').select('*'),sb.from('contacts').select('*'),sb.from('room_members').select('*'),sb.from('hidden_messages').select('message_id')]);
 mem={};(ms||[]).forEach(x=>(mem[x.room_id]=mem[x.room_id]||[]).push(x));hid=new Set((hs||[]).map(x=>x.message_id));
 rooms=(rs||[]).map(x=>{const mine=(mem[x.id]||[]).find(y=>y.user_id===me.id);return{id:'r'+x.id,rid:x.id,room:true,kind:x.kind,owner:x.owner,invite:x.invite,role:mine?mine.role:'member',display_name:x.title}});
 if(peer&&peer.room)peer=rooms.find(x=>x.id===peer.id)||peer;
 conts={};(cs||[]).forEach(c=>conts[c.contact]=c.alias||'');renderList();if(peer)renderMsgs()}
$('tChats').onclick=()=>{tab='chats';renderList()};$('tCont').onclick=()=>{tab='cont';renderList()};
async function addContact(u,alias){const{error}=await sb.rpc('save_contact',{cid:u.id,al:alias||null});if(error)alert(error.message);
 if(!error){conts[u.id]=alias||'';renderList();if(peer&&peer.id===u.id)setHead()}return !error}
async function addByName(){const n=(prompt(t('addby'))||'').trim().replace(/^@/,'').toLowerCase();if(!n)return;
 let u=users.find(x=>x.username===n);
 if(!u){const{data}=await sb.from('profiles').select('*').eq('username',n).maybeSingle();u=data;if(u&&u.id!==me.id)users.push(u)}
 if(!u||u.id===me.id){alert(t('nf'));return}await addContact(u,'')}
async function importContacts(){if(!('contacts' in navigator&&navigator.contacts.select)){alert(t('noimp'));return}
 try{const l=await navigator.contacts.select(['name','email'],{multiple:true});let n=0;
  for(const c of l)for(const em of (c.email||[])){const{data}=await sb.from('profiles').select('*').eq('email',em.trim().toLowerCase()).maybeSingle();
   if(data&&data.id!==me.id){if(!users.some(x=>x.id===data.id))users.push(data);if(await addContact(data,(c.name&&c.name[0])||''))n++;break}}
  alert(t('imported')+n)}catch(e){}}
const _sp=showProfile;
showProfile=function(){if(!peer)return;_sp();const r=!!peer.room,ic=peer.id in conts;
 $('vAdd').classList.toggle('hide',r);$('vLink').classList.toggle('hide',!r);$('vShare').classList.toggle('hide',!r);$('vMem').classList.toggle('hide',!r);if(r)renderMembers();
 if(r&&peer.invite)$('vLink').value=location.origin+location.pathname+'?j='+peer.invite;$('vRen').classList.toggle('hide',r||!ic);
 if(r)$('vInfo').textContent=t(peer.kind);else $('vAdd').textContent=t(ic?'delc':'addc')};
$('hav').onclick=$('hnm').onclick=showProfile;
$('vAdd').onclick=async()=>{if(!peer||peer.room)return;
 if(peer.id in conts){await sb.rpc('remove_contact',{cid:peer.id});delete conts[peer.id];renderList();setHead()}else await addContact(peer,'');showProfile()};
$('vRen').onclick=async()=>{if(!peer||peer.room)return;const a=prompt(t('alias'),conts[peer.id]||peer.display_name);if(a===null)return;await addContact(peer,a.trim());showProfile()};
$('bNew').onclick=()=>{if(tab==='cont'){addByName();return}
 const box=$('rMem');box.textContent='';
 users.filter(u=>u.id in conts).forEach(u=>{const l=document.createElement('label'),c=document.createElement('input'),s=document.createElement('span');l.className='chk';c.type='checkbox';c.value=u.id;s.textContent=dn(u);l.append(c,s);box.append(l)});
 $('rErr').textContent='';$('rmodal').classList.remove('hide')};
$('rX').onclick=()=>$('rmodal').classList.add('hide');
$('rGo').onclick=async()=>{const title=$('rTitle').value.trim();if(!title){$('rErr').textContent=t('e_title');return}
 const ids=[...$('rMem').querySelectorAll('input:checked')].map(i=>i.value);
 const{data:rid,error}=await sb.rpc('create_room',{k:$('rKind').value,ttl:title,members:ids});
 if(error){$('rErr').textContent=error.message;return}
 $('rmodal').classList.add('hide');$('rTitle').value='';await loadRooms();const o=rooms.find(x=>x.rid===rid);if(o)openChat(o)};
try{const j=new URLSearchParams(location.search).get('j');if(j)localStorage.setItem('xinh_join',j)}catch(e){}
async function joinPending(){let c=null;try{c=localStorage.getItem('xinh_join');localStorage.removeItem('xinh_join')}catch(e){}
 if(!c)return;history.replaceState(null,'',location.pathname);
 const{data,error}=await sb.rpc('join_room',{code:c});if(error||!data){alert(t('e_join'));return}
 await loadRooms();const o=rooms.find(x=>x.rid===data);if(o)openChat(o)}
$('vLink').onclick=e=>{e.target.select();if(navigator.clipboard)navigator.clipboard.writeText(e.target.value)};
$('vShare').onclick=()=>{const u=$('vLink').value;if(navigator.share)navigator.share({title:peer.display_name,url:u}).catch(()=>{});else if(navigator.clipboard){navigator.clipboard.writeText(u);alert(t('copied'))}};
const pc={};let curA=null;
function player(m){if(pc[m.id])return pc[m.id];
 const w=document.createElement('div');w.className='mp';pc[m.id]=w;
 const base=(m.file_name||'').replace(/\.[^.]+$/,''),i=base.indexOf(' - '),au=i>0?base.slice(0,i):'',ti=i>0?base.slice(i+3):base;
 const a=new Audio(m.file_url);a.preload='metadata';
 const cv=document.createElement('div');cv.className='cov';const b=document.createElement('button');b.type='button';b.textContent='▶';b.setAttribute('aria-label','Play');cv.append(b);
 const c=document.createElement('div'),tt=document.createElement('b'),aa=document.createElement('small'),bar=document.createElement('div'),bi=document.createElement('i');
 c.style.minWidth='0';tt.textContent=ti||'—';aa.textContent=au||'—';bar.className='bar';bar.append(bi);c.append(tt,aa,bar);w.append(cv,c);
 b.onclick=()=>{if(a.paused){if(curA&&curA!==a)curA.pause();curA=a;a.play()}else a.pause()};
 a.onplay=()=>b.textContent='❚❚';a.onpause=()=>b.textContent='▶';a.onended=()=>{b.textContent='▶';bi.style.width='0'};
 a.ontimeupdate=()=>{bi.style.width=(a.duration?a.currentTime/a.duration*100:0)+'%'};
 return w}

/* ===== МЕНЮ СООБЩЕНИЙ, УЧАСТНИКИ ===== */
let mem={},hid=new Set(),reply=null,lastPeer=null;
const loc=()=>S.lang==='ru'?'ru':'en';
const tgt=p=>p.room?{sender_id:me.id,room_id:p.rid}:{sender_id:me.id,recipient_id:p.id};
function showReply(){$('rbar').classList.toggle('hide',!reply);if(reply)$('rtxt').textContent='↩ '+(reply.body||'').slice(0,80)}
function sent(){reply=null;showReply()}
$('rx').onclick=sent;
function lp(d,m){let tm=null,x=0,y=0;const c=()=>clearTimeout(tm);
 d.addEventListener('pointerdown',e=>{x=e.clientX;y=e.clientY;tm=setTimeout(()=>openMenu(m),450)});
 ['pointerup','pointerleave','pointercancel'].forEach(k=>d.addEventListener(k,c));
 d.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-x)>10||Math.abs(e.clientY-y)>10)c()});
 d.oncontextmenu=e=>{e.preventDefault();c();openMenu(m)}}
function mItem(txt,fn){const b=document.createElement('button');b.textContent=txt;b.onclick=()=>{$('mm').classList.add('hide');fn()};return b}
$('mm').onclick=e=>{if(e.target===$('mm'))$('mm').classList.add('hide')};
function openMenu(m){const c=$('mmc');c.textContent='';const own=m.sender_id===me.id;
 if(own&&!m.room_id){const i=document.createElement('div');i.className='lbl';
  i.textContent=m.read_at?t('readat')+new Date(m.read_at).toLocaleString(loc(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):t('notread');c.append(i)}
 const cp=!peer.room||peer.kind==='group'||peer.role==='owner'||peer.role==='admin';
 if(cp)c.append(mItem(t('reply'),()=>{reply=m;showReply();$('txt').focus()}));
 c.append(mItem(t('fwdb'),()=>fwdPick(m)));
 if(!m.kind||m.kind==='text')c.append(mItem(t('copy'),()=>{if(navigator.clipboard)navigator.clipboard.writeText(m.body)}));
 if(m.file_url)c.append(mItem(t('save'),()=>saveFile(m)));
 if(cp)c.append(mItem(t(m.pinned?'unpin':'pin'),async()=>{const{error}=await sb.rpc('pin_message',{mid:m.id,v:!m.pinned});if(error)return alert(error.message);m.pinned=!m.pinned;renderMsgs()}));
 c.append(mItem(t('delme'),async()=>{const{error}=await sb.rpc('hide_message',{mid:m.id});if(error)return alert(error.message);hid.add(m.id);renderMsgs();renderList()}));
 if(own||(peer.room&&peer.owner===me.id))c.append(mItem(t('delall'),async()=>{const{error}=await sb.rpc('delete_message',{mid:m.id});if(error)return alert(error.message);msgs=msgs.filter(x=>x.id!==m.id);renderMsgs();renderList()}));
 $('mm').classList.remove('hide')}
async function saveFile(m){try{const b=await(await fetch(m.file_url)).blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=m.file_name||'file';
 document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){window.open(m.file_url,'_blank')}}
function fwdPick(m){const box=$('fList');box.textContent='';
 [...rooms,...users.filter(u=>last(u.id)||(u.id in conts))].forEach(u=>{const d=document.createElement('div');d.className='u';
  const av=document.createElement('div');av.className='av';setAv(av,u);const n=document.createElement('div');n.className='nm';n.textContent=dn(u);d.append(av,n);
  d.onclick=async()=>{$('fmodal').classList.add('hide');
   const nm=m.sender_id===me.id?((prof&&prof.display_name)||'XINH'):dn(users.find(x=>x.id===m.sender_id)||{display_name:'XINH'});
   const{data,error}=await sb.from('messages').insert({...tgt(u),body:m.body,kind:m.kind||'text',file_url:m.file_url||null,file_name:m.file_name||null,fwd:nm}).select().single();
   if(error){alert(t('notsent')+error.message);return}
   if(!msgs.some(x=>x.id===data.id)){msgs.push(data);renderList();if(peer&&peer.id===u.id)renderMsgs()}};
  box.append(d)});
 $('fmodal').classList.remove('hide')}
$('fX').onclick=()=>$('fmodal').classList.add('hide');
async function renderMembers(){const box=$('vMem'),r=peer;box.textContent='';if(!r||!r.room)return;
 const ms=[...(mem[r.rid]||[])],rk=x=>x.role==='owner'?0:x.role==='admin'?1:2,miss=ms.map(x=>x.user_id).filter(id=>id!==me.id&&!users.some(u=>u.id===id));
 if(miss.length){const{data}=await sb.from('profiles').select('*').in('id',miss);(data||[]).forEach(u=>users.push(u))}
 ms.sort((a,b)=>rk(a)-rk(b)).forEach(x=>{const u=x.user_id===me.id?{id:me.id,display_name:(prof&&prof.display_name)||''}:users.find(y=>y.id===x.user_id);
  const row=document.createElement('div');row.className='mrow';const n=document.createElement('span');n.textContent=u?dn(u):'…';
  if(x.role!=='member'){const b=document.createElement('span');b.className='badge';b.textContent=t('role_'+x.role);n.append(b)}row.append(n);
  if(r.role==='owner'&&x.role!=='owner'){const b=document.createElement('button');b.textContent=t(x.role==='admin'?'rmadm':'mkadm');
   b.onclick=async()=>{const{error}=await sb.rpc('set_admin',{rid:r.rid,uid:x.user_id,v:x.role!=='admin'});if(error)return alert(error.message);await loadRooms();renderMembers()};row.append(b)}
  box.append(row)})}
